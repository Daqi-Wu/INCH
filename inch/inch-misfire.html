<!-- INCH · MISFIRE / v1.0 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 · 哑火</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  "use strict";

  // ---------- 常量与色板 ----------
  var C = {
    bg0: "#101728", bg1: "#0a0e18", bg2: "#05070c",
    grid: "rgba(90,130,190,0.11)",
    player: "#7ce7ff",
    threat: "#ff5b5b",
    text: "#eaf6ff",
    text2: "rgba(180,205,230,0.7)",
    panel: "rgba(255,255,255,0.09)",
    line: "rgba(255,255,255,0.18)",
    wall: "rgba(140,235,255,0.25)",
    mono: 'ui-monospace, Consolas, monospace'
  };

  var ROOM_PAD = 40;
  var PLAYER_R = 14, PLAYER_SPEED = 210, PLAYER_HP = 100;
  var DASH_SPEED = 900, DASH_TIME = 0.15, DASH_CD = 1.25;
  var MAX_AMMO = 6, AMMO_W = 36, AMMO_H = 8, AMMO_GAP = 10;
  var BULLET_SPEED = 760, BULLET_R = 3.6, BULLET_DMG = 30, PIERCE = 2, MAX_BOUNCE = 6;
  var BOUNCE_DAMP = 0.92;
  var SHELL_R = 4, SHELL_LIFE = 20;
  var ENEMY_PER_ROOM = 10, ENEMY_HP = 30, ENEMY_SPEED = 110, ENEMY_R = 15, ENEMY_DMG = 15;
  var CONTACT_INVULN = 0.55, CONTACT_CD = 0.7;
  var DRY_LIMIT = 3.0;          // 弹药为 0 且仍有敌人，撑过 3s 即失败
  var FIRE_CD = 0.12;

  // ---------- 工具 ----------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }

  // ---------- 画布与 DPR ----------
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 输入 ----------
  var keys = Object.create(null);
  var mouse = { x: 0, y: 0, down: false };
  var fireQueued = false;
  var pickFlash = 0;

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
    keys[e.code] = true;
    if (e.code === "Escape") { togglePause(); return; }
    if (e.code === "KeyR" && game.state === "over") { reset(); return; }
    if ((e.code === "Enter" || e.code === "Space") && game.state === "menu") reset();
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });

  canvas.addEventListener("mousemove", function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  canvas.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    mouse.down = true;
    if (game.state === "menu" || game.state === "over") { reset(); return; }
    fireQueued = true;
  });
  window.addEventListener("mouseup", function (e) { if (e.button === 0) mouse.down = false; });
  window.addEventListener("blur", function () { mouse.down = false; keys = Object.create(null); });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // ---------- 状态对象 ----------
  var game = {
    state: "menu",
    player: null,
    bullets: [],
    shells: [],
    enemies: [],
    particles: [],
    wallFlashes: [],
    score: 0,
    kills: 0,
    room: 1,
    roomDelay: 0,
    spawnTimer: 0,
    spawnLeft: 0,
    dryTimer: 0,
    banner: "",
    bannerTime: 0,
    shake: 0,
    hitFlash: 0,
    timeAlive: 0,
    clock: 0
  };

  function room() {
    return { x: ROOM_PAD, y: ROOM_PAD, w: W - ROOM_PAD * 2, h: H - ROOM_PAD * 2 };
  }

  function makePlayer() {
    return {
      x: W / 2, y: H / 2, r: PLAYER_R,
      hp: PLAYER_HP, maxHp: PLAYER_HP,
      aim: 0, fireCd: 0, invuln: 0,
      dashCd: 0, dashTime: 0, dashX: 0, dashY: 0,
      muzzle: 0, recoil: 0
    };
  }

  function reset() {
    game.state = "playing";
    game.player = makePlayer();
    game.bullets = [];
    game.shells = [];
    game.enemies = [];
    game.particles = [];
    game.wallFlashes = [];
    game.score = 0;
    game.kills = 0;
    game.room = 0;
    game.roomDelay = 0.6;
    game.spawnTimer = 0;
    game.spawnLeft = 0;
    game.dryTimer = 0;
    game.banner = "";
    game.bannerTime = 0;
    game.shake = 0;
    game.hitFlash = 0;
    game.timeAlive = 0;
    game.player.ammo = MAX_AMMO;
    startRoom();
  }

  function togglePause() {
    if (game.state === "playing") game.state = "paused";
    else if (game.state === "paused") game.state = "playing";
  }

  function startRoom() {
    game.room++;
    game.spawnLeft = ENEMY_PER_ROOM;
    game.spawnTimer = 0;
    game.banner = "第 " + String(game.room).padStart(2, "0") + " 关";
    game.bannerTime = 1.6;
  }

  // ---------- 特效 ----------
  function burst(x, y, color, count, power) {
    for (var i = 0; i < count; i++) {
      var a = rand(0, Math.PI * 2);
      var s = rand(0.2, 1) * power;
      var life = rand(0.25, 0.7);
      game.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: life, maxLife: life,
        size: rand(1.5, 3.6), color: color
      });
    }
  }

  function spawnEnemy() {
    var r = room();
    var side = Math.floor(Math.random() * 4);
    var x, y;
    if (side === 0) { x = rand(r.x, r.x + r.w); y = r.y + 22; }
    else if (side === 1) { x = r.x + r.w - 22; y = rand(r.y, r.y + r.h); }
    else if (side === 2) { x = rand(r.x, r.x + r.w); y = r.y + r.h - 22; }
    else { x = r.x + 22; y = rand(r.y, r.y + r.h); }

    game.enemies.push({
      x: x, y: y, r: ENEMY_R,
      hp: ENEMY_HP, maxHp: ENEMY_HP,
      vx: 0, vy: 0, hitCd: 0, hurt: 0
    });
  }

  function shoot(p) {
    if (p.ammo <= 0 || p.fireCd > 0) return;
    p.ammo--;
    pickFlash = 0;
    var ang = p.aim + rand(-0.012, 0.012);
    var mx = p.x + Math.cos(ang) * (p.r + 10);
    var my = p.y + Math.sin(ang) * (p.r + 10);
    game.bullets.push({
      x: mx, y: my,
      vx: Math.cos(ang) * BULLET_SPEED,
      vy: Math.sin(ang) * BULLET_SPEED,
      r: BULLET_R, hits: 0, bounces: 0
    });
    p.muzzle = 0.07;
    p.recoil = 4;
    p.fireCd = FIRE_CD;
    game.shake = Math.min(game.shake + 1.6, 9);
    burst(mx, my, "#ffe9a8", 3, 90);
  }

  function dropShell(x, y) {
    game.shells.push({ x: x, y: y, life: SHELL_LIFE, phase: rand(0, 6.28) });
  }

  function die() {
    game.state = "over";
    game.shake = 22;
    burst(game.player.x, game.player.y, "#ff4d4d", 60, 420);
    burst(game.player.x, game.player.y, "#ffffff", 20, 260);
  }

  // ---------- 更新 ----------
  function update(dt) {
    var p = game.player;
    var r = room();
    game.timeAlive += dt;
    game.shake = Math.max(0, game.shake - dt * 26);
    game.hitFlash = Math.max(0, game.hitFlash - dt);
    game.bannerTime = Math.max(0, game.bannerTime - dt);
    pickFlash = Math.max(0, pickFlash - dt);

    p.aim = Math.atan2(mouse.y - p.y, mouse.x - p.x);

    var mx = (keys["KeyD"] || keys["ArrowRight"] ? 1 : 0) - (keys["KeyA"] || keys["ArrowLeft"] ? 1 : 0);
    var my = (keys["KeyS"] || keys["ArrowDown"] ? 1 : 0) - (keys["KeyW"] || keys["ArrowUp"] ? 1 : 0);
    var len = Math.hypot(mx, my);
    if (len > 0) { mx /= len; my /= len; }

    p.dashCd = Math.max(0, p.dashCd - dt);
    if ((keys["ShiftLeft"] || keys["ShiftRight"]) && p.dashCd <= 0 && p.dashTime <= 0 && len > 0) {
      p.dashTime = DASH_TIME;
      p.dashCd = DASH_CD;
      p.dashX = mx; p.dashY = my;
      burst(p.x, p.y, C.player, 12, 160);
    }

    if (p.dashTime > 0) {
      p.dashTime -= dt;
      p.x += p.dashX * DASH_SPEED * dt;
      p.y += p.dashY * DASH_SPEED * dt;
      burst(p.x, p.y, C.player, 1, 20);
    } else {
      p.x += mx * PLAYER_SPEED * dt;
      p.y += my * PLAYER_SPEED * dt;
    }
    p.x = clamp(p.x, r.x + p.r, r.x + r.w - p.r);
    p.y = clamp(p.y, r.y + p.r, r.y + r.h - p.r);

    p.invuln = Math.max(0, p.invuln - dt);
    p.muzzle = Math.max(0, p.muzzle - dt);
    p.recoil = Math.max(0, p.recoil - dt * 22);
    p.fireCd = Math.max(0, p.fireCd - dt);

    if (fireQueued) { fireQueued = false; shoot(p); }

    // 子弹：反弹、贯穿
    for (var i = game.bullets.length - 1; i >= 0; i--) {
      var b = game.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      var hitWall = false;
      if (b.x < r.x + b.r) { b.x = r.x + b.r; b.vx = Math.abs(b.vx); hitWall = true; }
      else if (b.x > r.x + r.w - b.r) { b.x = r.x + r.w - b.r; b.vx = -Math.abs(b.vx); hitWall = true; }
      if (b.y < r.y + b.r) { b.y = r.y + b.r; b.vy = Math.abs(b.vy); hitWall = true; }
      else if (b.y > r.y + r.h - b.r) { b.y = r.y + r.h - b.r; b.vy = -Math.abs(b.vy); hitWall = true; }

      if (hitWall) {
        b.bounces++;
        b.vx *= BOUNCE_DAMP;
        b.vy *= BOUNCE_DAMP;
        game.wallFlashes.push({ x: b.x, y: b.y, life: 0.1, maxLife: 0.1 });
        burst(b.x, b.y, "#fff6cf", 3, 120);
        if (b.bounces > MAX_BOUNCE) {
          dropShell(b.x, b.y);
          game.bullets.splice(i, 1);
          continue;
        }
      }

      // 贯穿判定
      for (var j = game.enemies.length - 1; j >= 0; j--) {
        var e = game.enemies[j];
        var hr = e.r + b.r;
        if (dist2(b.x, b.y, e.x, e.y) > hr * hr) continue;

        e.hp -= BULLET_DMG;
        e.hurt = 0.12;
        e.vx += b.vx * 0.012;
        e.vy += b.vy * 0.012;
        burst(b.x, b.y, "#ff9b9b", 5, 150);
        b.hits++;
        game.shake = Math.min(game.shake + 1.6, 9);

        if (e.hp <= 0) {
          burst(e.x, e.y, C.threat, 22, 300);
          burst(e.x, e.y, "#ffffff", 6, 180);
          game.kills++;
          game.shake = Math.min(game.shake + 4, 14);
          game.enemies.splice(j, 1);
        }
        if (b.hits >= PIERCE) { game.bullets.splice(i, 1); break; }
      }
    }

    // 敌人：直线追击
    for (var k = game.enemies.length - 1; k >= 0; k--) {
      var en = game.enemies[k];
      en.hurt = Math.max(0, en.hurt - dt);
      en.hitCd = Math.max(0, en.hitCd - dt);

      var dx = p.x - en.x, dy = p.y - en.y;
      var d = Math.hypot(dx, dy) || 1;
      var nx = dx / d, ny = dy / d;
      en.x += (nx * ENEMY_SPEED + en.vx) * dt;
      en.y += (ny * ENEMY_SPEED + en.vy) * dt;
      en.vx *= Math.pow(0.0025, dt);
      en.vy *= Math.pow(0.0025, dt);

      var rr = en.r + p.r;
      if (dist2(en.x, en.y, p.x, p.y) < rr * rr && en.hitCd <= 0 && p.invuln <= 0 && p.dashTime <= 0) {
        p.hp -= ENEMY_DMG;
        p.invuln = CONTACT_INVULN;
        en.hitCd = CONTACT_CD;
        en.vx = -nx * 320;
        en.vy = -ny * 320;
        game.shake = Math.min(game.shake + 8, 16);
        game.hitFlash = 0.6;
        burst(p.x, p.y, "#ff4d4d", 14, 220);
        if (p.hp <= 0) { die(); return; }
      }
    }

    // 弹壳回收
    for (var q = game.shells.length - 1; q >= 0; q--) {
      var s = game.shells[q];
      s.life -= dt;
      s.phase += dt * 4;
      if (s.life <= 0) { game.shells.splice(q, 1); continue; }
      var sr = SHELL_R + p.r;
      if (dist2(s.x, s.y, p.x, p.y) < sr * sr && p.ammo < MAX_AMMO) {
        p.ammo++;
        pickFlash = 0.15;
        burst(s.x, s.y, C.player, 16, 200);
        game.shells.splice(q, 1);
      }
    }

    // 粒子
    for (var m = game.particles.length - 1; m >= 0; m--) {
      var pt = game.particles[m];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= Math.pow(0.02, dt);
      pt.vy *= Math.pow(0.02, dt);
      pt.life -= dt;
      if (pt.life <= 0) game.particles.splice(m, 1);
    }

    for (var n = game.wallFlashes.length - 1; n >= 0; n--) {
      game.wallFlashes[n].life -= dt;
      if (game.wallFlashes[n].life <= 0) game.wallFlashes.splice(n, 1);
    }

    // 刷怪
    if (game.spawnLeft > 0) {
      game.spawnTimer -= dt;
      if (game.spawnTimer <= 0 && game.enemies.length < 10) {
        spawnEnemy();
        game.spawnLeft--;
        game.spawnTimer = rand(0.35, 0.7);
      }
    } else if (game.enemies.length === 0) {
      game.roomDelay -= dt;
      if (game.roomDelay <= 0) { startRoom(); game.roomDelay = 1.0; }
    }

    // 干膛判定
    if (p.ammo <= 0 && game.enemies.length > 0) {
      game.dryTimer += dt;
      if (game.dryTimer >= DRY_LIMIT) { die(); return; }
    } else {
      game.dryTimer = 0;
    }

    game.score = p.ammo * 10 + game.kills * 5;
  }

  // ---------- 绘制 ----------
  function drawBackground() {
    var g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.max(W, H) * 0.78);
    g.addColorStop(0, C.bg0);
    g.addColorStop(0.55, C.bg1);
    g.addColorStop(1, C.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var step = 64;
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x < W + step; x += step) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
    }
    for (var y = 0; y < H + step; y += step) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
    }
    ctx.stroke();
  }

  function drawRoom() {
    var r = room();
    ctx.strokeStyle = C.wall;
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
  }

  function drawShells() {
    for (var i = 0; i < game.shells.length; i++) {
      var s = game.shells[i];
      var a = s.life < 3 ? 0.35 + Math.sin(s.phase * 3) * 0.25 : 1;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(s.x, s.y, SHELL_R + 3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(124,231,255,0.14)";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(s.x, s.y, SHELL_R, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(124,231,255,0.35)";
      ctx.fill();
      ctx.strokeStyle = C.player;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawBullets() {
    for (var i = 0; i < game.bullets.length; i++) {
      var b = game.bullets[i];
      var d = Math.hypot(b.vx, b.vy) || 1;
      var ux = b.vx / d, uy = b.vy / d;
      ctx.beginPath();
      ctx.moveTo(b.x - ux * 16, b.y - uy * 16);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = "rgba(255,240,180,0.5)";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = "#fff6cf";
      ctx.fill();
    }
    ctx.lineCap = "butt";

    for (var j = 0; j < game.wallFlashes.length; j++) {
      var f = game.wallFlashes[j];
      ctx.globalAlpha = f.life / f.maxLife;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);

    ctx.beginPath();
    ctx.arc(0, 5, e.r + 2, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.42)";
    ctx.fill();

    var body = e.hurt > 0 ? "#ffffff" : C.threat;
    ctx.beginPath();
    ctx.arc(0, 0, e.r, 0, Math.PI * 2);
    var g = ctx.createRadialGradient(-e.r * 0.3, -e.r * 0.35, 1, 0, 0, e.r + 1);
    g.addColorStop(0, e.hurt > 0 ? "#ffffff" : "#ff9b9b");
    g.addColorStop(1, body);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.stroke();

    if (e.hp < e.maxHp) {
      var w = e.r * 2;
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(-w / 2, -e.r - 9, w, 4);
      ctx.fillStyle = C.threat;
      ctx.fillRect(-w / 2, -e.r - 9, w * (e.hp / e.maxHp), 4);
    }
    ctx.restore();
  }

  function drawPlayer(p) {
    ctx.save();
    ctx.translate(p.x, p.y);

    ctx.beginPath();
    ctx.arc(0, 4, p.r + 2, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.42)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, p.r + 6, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(124,231,255,0.14)";
    ctx.fill();

    var bodyAlpha = p.invuln > 0 ? 0.35 : 1;

    ctx.save();
    ctx.rotate(p.aim);
    ctx.fillStyle = "rgba(190,215,245,1)";
    ctx.fillRect(p.r - 3 - p.recoil, -3.2, 20, 6.4);
    if (p.muzzle > 0) {
      ctx.beginPath();
      ctx.arc(p.r + 19 - p.recoil, 0, 8 + p.muzzle * 60, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,235,150,0.85)";
      ctx.fill();
    }
    ctx.restore();

    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, Math.PI * 2);
    var pg = ctx.createRadialGradient(-4, -5, 2, 0, 0, p.r + 2);
    pg.addColorStop(0, "rgba(190,245,255," + bodyAlpha + ")");
    pg.addColorStop(1, "rgba(60,150,220," + (bodyAlpha * 0.9) + ")");
    ctx.fillStyle = pg;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(150,235,255," + (bodyAlpha * 0.9) + ")";
    ctx.stroke();

    ctx.save();
    ctx.rotate(p.aim);
    ctx.beginPath();
    ctx.moveTo(p.r - 1, 0);
    ctx.lineTo(p.r - 9, -5);
    ctx.lineTo(p.r - 9, 5);
    ctx.closePath();
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fill();
    ctx.restore();

    ctx.restore();

    if (p.dashCd > 0) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 8, -Math.PI / 2, -Math.PI / 2 + (1 - p.dashCd / DASH_CD) * Math.PI * 2);
      ctx.strokeStyle = "rgba(124,231,255,0.5)";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  }

  function drawHUD() {
    var p = game.player;

    // 弹药槽
    for (var i = 0; i < MAX_AMMO; i++) {
      var x = 24 + i * (AMMO_W + AMMO_GAP);
      var y = 27;
      var scale = (i === p.ammo - 1 && pickFlash > 0) ? 1 + 0.25 * (pickFlash / 0.15) : 1;
      var w = AMMO_W * scale, h = AMMO_H * scale;
      if (i < p.ammo) {
        ctx.fillStyle = C.player;
        ctx.fillRect(x - (w - AMMO_W) / 2, y - (h - AMMO_H) / 2, w, h);
      } else {
        ctx.strokeStyle = "rgba(124,231,255,0.35)";
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, AMMO_W, AMMO_H);
      }
    }

    // 血量细线（哑火的生存压力在弹药，血量只做底线提示）
    var hpr = clamp(p.hp / p.maxHp, 0, 1);
    ctx.fillStyle = "rgba(255,255,255,0.09)";
    ctx.fillRect(24, 44, 244, 3);
    ctx.fillStyle = hpr > 0.35 ? "rgba(46,230,168,0.85)" : "rgba(255,59,59,0.9)";
    ctx.fillRect(24, 44, 244 * hpr, 3);

    ctx.font = "500 12px " + C.mono;
    ctx.fillStyle = C.text2;
    ctx.textAlign = "left";
    ctx.fillText("AMMO " + p.ammo + " / " + MAX_AMMO, 24, 62);

    // 分数
    ctx.textAlign = "right";
    ctx.font = "700 26px " + C.mono;
    ctx.fillStyle = C.text;
    ctx.fillText(String(game.score).padStart(5, "0"), W - 24, 46);
    ctx.font = "500 12px " + C.mono;
    ctx.fillStyle = C.text2;
    ctx.fillText("ROOM " + String(game.room).padStart(2, "0") + "   KILLS " + game.kills, W - 24, 66);

    // 准星
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.strokeStyle = "rgba(140,235,255,0.9)";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-16, 0); ctx.lineTo(-6, 0);
    ctx.moveTo(16, 0); ctx.lineTo(6, 0);
    ctx.moveTo(0, -16); ctx.lineTo(0, -6);
    ctx.moveTo(0, 16); ctx.lineTo(0, 6);
    ctx.stroke();
    ctx.fillStyle = "rgba(140,235,255,0.9)";
    ctx.fillRect(-1.5, -1.5, 3, 3);
    ctx.restore();

    // 波次横幅
    if (game.bannerTime > 0) {
      var a = Math.min(1, game.bannerTime / 0.4);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = "center";
      ctx.font = "800 52px " + C.mono;
      ctx.fillStyle = "#eaf6ff";
      ctx.fillText(game.banner, W / 2, H * 0.24);
      ctx.font = "500 13px " + C.mono;
      ctx.fillStyle = "rgba(150,200,235,0.85)";
      ctx.fillText("ENEMIES INCOMING", W / 2, H * 0.24 + 26);
      ctx.restore();
    }
  }

  function drawOverlay() {
    ctx.textAlign = "center";

    if (game.state === "menu") {
      ctx.fillStyle = "rgba(5,8,14,0.78)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 62px " + C.mono;
      ctx.letterSpacing = "0.12em";
      ctx.fillText("哑火", W / 2 + 4, H / 2 - 60);
      ctx.letterSpacing = "0px";
      ctx.font = "500 15px " + C.mono;
      ctx.fillStyle = "rgba(160,205,240,0.85)";
      ctx.fillText("WASD 移动 · 鼠标瞄准 · 左键射击 · Shift 冲刺 · Esc 暂停", W / 2, H / 2 - 14);
      ctx.font = "600 16px " + C.mono;
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      ctx.globalAlpha = 0.55 + Math.sin(game.clock / 0.32) * 0.45;
      ctx.fillText("点击屏幕开始", W / 2, H / 2 + 44);
      ctx.globalAlpha = 1;
    } else if (game.state === "paused") {
      ctx.fillStyle = "rgba(5,8,14,0.70)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 44px " + C.mono;
      ctx.fillText("已暂停", W / 2, H / 2 - 6);
      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(160,205,240,0.8)";
      ctx.fillText("按 Esc 继续", W / 2, H / 2 + 28);
    } else if (game.state === "over") {
      ctx.fillStyle = "rgba(10,4,6,0.82)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ff6b6b";
      ctx.font = "800 56px " + C.mono;
      ctx.fillText("阵　亡", W / 2, H / 2 - 70);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "700 30px " + C.mono;
      ctx.fillText("得分 " + game.score, W / 2, H / 2 - 10);
      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(170,200,225,0.85)";
      ctx.fillText("闯过 " + game.room + " 关 · 击杀 " + game.kills + " · 存活 " + game.timeAlive.toFixed(1) + " 秒", W / 2, H / 2 + 22);
      ctx.font = "600 16px " + C.mono;
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      ctx.globalAlpha = 0.55 + Math.sin(game.clock / 0.32) * 0.45;
      ctx.fillText("点击或按 R 重新开始", W / 2, H / 2 + 68);
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    var sx = 0, sy = 0;
    if (game.shake > 0.2) {
      sx = rand(-game.shake, game.shake) * 0.3;
      sy = rand(-game.shake, game.shake) * 0.3;
    }

    ctx.save();
    ctx.translate(sx, sy);
    drawBackground();

    if (game.state !== "menu") {
      drawRoom();
      drawShells();
      for (var i = 0; i < game.enemies.length; i++) drawEnemy(game.enemies[i]);
      drawBullets();
      if (game.state !== "over") drawPlayer(game.player);
    }

    for (var j = 0; j < game.particles.length; j++) {
      var pt = game.particles[j];
      ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (game.state !== "menu") {
      if (game.hitFlash > 0) {
        var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
        vg.addColorStop(0, "rgba(255,0,0,0)");
        vg.addColorStop(1, "rgba(255,0,0," + (game.hitFlash * 0.45) + ")");
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
      }
      var vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.85);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, "rgba(0,0,0,0.55)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);
      drawHUD();
    } else {
      var vig2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.85);
      vig2.addColorStop(0, "rgba(0,0,0,0)");
      vig2.addColorStop(1, "rgba(0,0,0,0.55)");
      ctx.fillStyle = vig2;
      ctx.fillRect(0, 0, W, H);
    }
    drawOverlay();
  }

  // ---------- 主循环 ----------
  var last = performance.now();

  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    game.clock += dt;

    if (game.state === "playing") update(dt);
    render();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
