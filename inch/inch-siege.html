<!-- INCH · SIEGE / v1.0 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 · 围城</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 输入 ----------
  var keys = Object.create(null);
  var mouse = { x: W / 2, y: H / 2, down: false };

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown" ||
        e.code === "ArrowLeft" || e.code === "ArrowRight") e.preventDefault();
    keys[e.code] = true;
    if (e.code === "Escape") togglePause();
    if (e.code === "KeyR" && game.state === "over") reset();
    if (e.code === "Enter" || e.code === "Space") {
      if (game.state === "menu") reset();
    }
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });

  canvas.addEventListener("mousemove", function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  canvas.addEventListener("mousedown", function (e) {
    if (e.button === 0) {
      mouse.down = true;
      if (game.state === "menu" || game.state === "over") reset();
    }
  });
  window.addEventListener("mouseup", function (e) { if (e.button === 0) mouse.down = false; });
  window.addEventListener("blur", function () { mouse.down = false; keys = Object.create(null); });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // ---------- 工具 ----------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ---------- 数据 ----------
  var TYPES = {
    chaser: { r: 15, hp: 30, speed: 100, dmg: 12, score: 10, color: "#ff5b5b", glow: "#ff9b9b" },
    fast:   { r: 10, hp: 16, speed: 190, dmg: 8,  score: 15, color: "#ffd166", glow: "#fff0b8" },
    tank:   { r: 26, hp: 130, speed: 58, dmg: 22, score: 30, color: "#a06bff", glow: "#d6c2ff" }
  };

  var game = {
    state: "menu",
    player: null,
    bullets: [],
    enemies: [],
    particles: [],
    pickups: [],
    score: 0,
    wave: 0,
    waveDelay: 0,
    spawnQueue: [],
    spawnTimer: 0,
    banner: "",
    bannerTime: 0,
    shake: 0,
    hitFlash: 0,
    kills: 0,
    timeAlive: 0
  };

  function makePlayer() {
    return {
      x: W / 2, y: H / 2, r: 14,
      speed: 265,
      hp: 100, maxHp: 100,
      aim: 0,
      fireCd: 0,
      invuln: 0,
      dashCd: 0,
      dashTime: 0,
      dashDirX: 0, dashDirY: 0,
      muzzle: 0,
      recoil: 0
    };
  }

  function reset() {
    game.state = "playing";
    game.player = makePlayer();
    game.bullets = [];
    game.enemies = [];
    game.particles = [];
    game.pickups = [];
    game.score = 0;
    game.wave = 0;
    game.waveDelay = 0.9;
    game.spawnQueue = [];
    game.spawnTimer = 0;
    game.banner = "";
    game.bannerTime = 0;
    game.shake = 0;
    game.hitFlash = 0;
    game.kills = 0;
    game.timeAlive = 0;
  }

  function togglePause() {
    if (game.state === "playing") game.state = "paused";
    else if (game.state === "paused") game.state = "playing";
  }

  // ---------- 波次 ----------
  function startWave() {
    game.wave++;
    var n = 4 + Math.floor(game.wave * 2.2);
    var q = [];
    for (var i = 0; i < n; i++) {
      var roll = Math.random();
      var t = "chaser";
      if (game.wave >= 3 && roll > 0.72) t = "fast";
      if (game.wave >= 4 && roll > 0.9) t = "tank";
      q.push(t);
    }
    game.spawnQueue = game.spawnQueue.concat(q);
    game.spawnTimer = 0;
    game.banner = "第 " + game.wave + " 波";
    game.bannerTime = 1.6;
  }

  function spawnEnemy(typeName) {
    var t = TYPES[typeName];
    var edge = Math.floor(Math.random() * 4);
    var pad = 60;
    var x, y;
    if (edge === 0) { x = rand(0, W); y = -pad; }
    else if (edge === 1) { x = W + pad; y = rand(0, H); }
    else if (edge === 2) { x = rand(0, W); y = H + pad; }
    else { x = -pad; y = rand(0, H); }

    var scale = 1 + (game.wave - 1) * 0.17;
    game.enemies.push({
      type: typeName,
      x: x, y: y,
      r: t.r,
      hp: t.hp * scale,
      maxHp: t.hp * scale,
      speed: t.speed * (1 + (game.wave - 1) * 0.02),
      dmg: t.dmg,
      score: t.score,
      color: t.color,
      glow: t.glow,
      hitCd: 0,
      hurt: 0,
      vx: 0, vy: 0,
      wobble: rand(0, Math.PI * 2)
    });
  }

  // ---------- 特效 ----------
  function burst(x, y, color, count, power) {
    for (var i = 0; i < count; i++) {
      var a = rand(0, Math.PI * 2);
      var s = rand(0.2, 1) * power;
      game.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: rand(0.25, 0.7),
        maxLife: 0.7,
        size: rand(1.5, 3.6),
        color: color
      });
    }
  }

  function trail(x, y, color) {
    game.particles.push({
      x: x, y: y, vx: rand(-20, 20), vy: rand(-20, 20),
      life: 0.22, maxLife: 0.22, size: rand(1, 2.2), color: color
    });
  }

  // ---------- 射击 ----------
  function shoot(p) {
    var a = p.aim;
    var spread = rand(-0.035, 0.035);
    var ang = a + spread;
    var spd = 1020;
    var mx = p.x + Math.cos(a) * (p.r + 10);
    var my = p.y + Math.sin(a) * (p.r + 10);
    game.bullets.push({
      x: mx, y: my,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      r: 3.6, life: 0.85, dmg: 26
    });
    p.muzzle = 0.07;
    p.recoil = 4;
    game.shake = Math.min(game.shake + 1.6, 9);
    burst(mx, my, "#ffe9a8", 3, 90);
  }

  // ---------- 更新 ----------
  function update(dt) {
    var p = game.player;
    game.timeAlive += dt;
    game.shake = Math.max(0, game.shake - dt * 26);
    game.hitFlash = Math.max(0, game.hitFlash - dt * 2.4);
    game.bannerTime = Math.max(0, game.bannerTime - dt);

    // 瞄准
    p.aim = Math.atan2(mouse.y - p.y, mouse.x - p.x);

    // 移动
    var mx = (keys["KeyD"] || keys["ArrowRight"] ? 1 : 0) - (keys["KeyA"] || keys["ArrowLeft"] ? 1 : 0);
    var my = (keys["KeyS"] || keys["ArrowDown"] ? 1 : 0) - (keys["KeyW"] || keys["ArrowUp"] ? 1 : 0);
    var len = Math.hypot(mx, my);
    if (len > 0) { mx /= len; my /= len; }

    // 冲刺
    p.dashCd = Math.max(0, p.dashCd - dt);
    if (keys["ShiftLeft"] && p.dashCd <= 0 && p.dashTime <= 0 && len > 0) {
      p.dashTime = 0.15;
      p.dashCd = 1.25;
      p.dashDirX = mx; p.dashDirY = my;
      burst(p.x, p.y, "#7ce7ff", 12, 160);
    }

    if (p.dashTime > 0) {
      p.dashTime -= dt;
      p.x += p.dashDirX * 900 * dt;
      p.y += p.dashDirY * 900 * dt;
      trail(p.x, p.y, "#7ce7ff");
    } else {
      p.x += mx * p.speed * dt;
      p.y += my * p.speed * dt;
    }

    p.x = clamp(p.x, p.r, W - p.r);
    p.y = clamp(p.y, p.r, H - p.r);

    p.invuln = Math.max(0, p.invuln - dt);
    p.muzzle = Math.max(0, p.muzzle - dt);
    p.recoil = Math.max(0, p.recoil - dt * 22);

    // 开火
    p.fireCd -= dt;
    if (mouse.down && p.fireCd <= 0 && game.state === "playing") {
      shoot(p);
      p.fireCd = 0.105;
    }

    // 子弹
    for (var i = game.bullets.length - 1; i >= 0; i--) {
      var b = game.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) {
        game.bullets.splice(i, 1);
      }
    }

    // 敌人
    var px = game.player.x, py = game.player.y;
    for (var j = game.enemies.length - 1; j >= 0; j--) {
      var e = game.enemies[j];
      e.hurt = Math.max(0, e.hurt - dt);
      e.hitCd = Math.max(0, e.hitCd - dt);
      e.wobble += dt * 6;

      var dx = px - e.x, dy = py - e.y;
      var d = Math.hypot(dx, dy) || 1;
      var nx = dx / d, ny = dy / d;

      // 分离力，避免完全重叠
      var sepX = 0, sepY = 0;
      for (var k = 0; k < game.enemies.length; k++) {
        if (k === j) continue;
        var o = game.enemies[k];
        var ddx = e.x - o.x, ddy = e.y - o.y;
        var dd = Math.hypot(ddx, ddy);
        if (dd > 0 && dd < e.r + o.r) {
          sepX += (ddx / dd) * (e.r + o.r - dd) * 2.2;
          sepY += (ddy / dd) * (e.r + o.r - dd) * 2.2;
        }
      }

      var wob = Math.sin(e.wobble) * 0.28;
      var mvx = nx * e.speed + sepX + (-ny) * wob * e.speed * 0.5 + e.vx;
      var mvy = ny * e.speed + sepY + (nx) * wob * e.speed * 0.5 + e.vy;
      e.x += mvx * dt;
      e.y += mvy * dt;
      e.vx *= Math.pow(0.0025, dt);
      e.vy *= Math.pow(0.0025, dt);

      // 接触伤害
      var rr = e.r + game.player.r;
      if (dist2(e.x, e.y, px, py) < rr * rr && e.hitCd <= 0 && game.player.invuln <= 0) {
        game.player.hp -= e.dmg;
        game.player.invuln = 0.55;
        e.hitCd = 0.7;
        game.shake = Math.min(game.shake + 8, 16);
        game.hitFlash = 0.6;
        var kb = 320;
        e.vx = -nx * kb;
        e.vy = -ny * kb;
        game.player.x = clamp(game.player.x - nx * 14, game.player.r, W - game.player.r);
        game.player.y = clamp(game.player.y - ny * 14, game.player.r, H - game.player.r);
        burst(px, py, "#ff4d4d", 14, 220);
        if (game.player.hp <= 0) { die(); return; }
      }

      // 子弹命中
      for (var m = game.bullets.length - 1; m >= 0; m--) {
        var bl = game.bullets[m];
        var hrr = e.r + bl.r;
        if (dist2(bl.x, bl.y, e.x, e.y) < hrr * hrr) {
          e.hp -= bl.dmg;
          e.hurt = 0.12;
          e.vx += bl.vx * 0.012;
          e.vy += bl.vy * 0.012;
          burst(bl.x, bl.y, e.glow, 5, 150);
          game.bullets.splice(m, 1);
          if (e.hp <= 0) {
            burst(e.x, e.y, e.color, 22, 300);
            burst(e.x, e.y, "#ffffff", 6, 180);
            game.score += e.score;
            game.kills++;
            game.shake = Math.min(game.shake + 4, 14);
            if (Math.random() < 0.13) {
              game.pickups.push({ x: e.x, y: e.y, r: 11, life: 13, phase: rand(0, 6.28) });
            }
            game.enemies.splice(j, 1);
          }
          break;
        }
      }
    }

    // 补给
    for (var q = game.pickups.length - 1; q >= 0; q--) {
      var pk = game.pickups[q];
      pk.life -= dt;
      pk.phase += dt * 4;
      if (pk.life <= 0) { game.pickups.splice(q, 1); continue; }
      var pr = pk.r + game.player.r;
      if (dist2(pk.x, pk.y, game.player.x, game.player.y) < pr * pr) {
        game.player.hp = Math.min(game.player.maxHp, game.player.hp + 28);
        burst(pk.x, pk.y, "#5df2a0", 16, 200);
        game.pickups.splice(q, 1);
      }
    }

    // 粒子
    for (var n2 = game.particles.length - 1; n2 >= 0; n2--) {
      var pt = game.particles[n2];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= Math.pow(0.02, dt);
      pt.vy *= Math.pow(0.02, dt);
      pt.life -= dt;
      if (pt.life <= 0) game.particles.splice(n2, 1);
    }

    // 刷怪
    if (game.spawnQueue.length > 0) {
      game.spawnTimer -= dt;
      if (game.spawnTimer <= 0 && game.enemies.length < 46) {
        var cnt = Math.min(game.spawnQueue.length, 1 + Math.floor(Math.random() * 3));
        for (var s = 0; s < cnt; s++) spawnEnemy(game.spawnQueue.shift());
        game.spawnTimer = rand(0.28, 0.6);
      }
    } else if (game.enemies.length === 0) {
      game.waveDelay -= dt;
      if (game.waveDelay <= 0) {
        startWave();
        game.waveDelay = 2.0;
      }
    }
  }

  function die() {
    game.state = "over";
    burst(game.player.x, game.player.y, "#ff4d4d", 60, 420);
    burst(game.player.x, game.player.y, "#ffffff", 20, 260);
    game.shake = 22;
  }

  // ---------- 绘制 ----------
  function drawBackground(t) {
    var g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.max(W, H) * 0.78);
    g.addColorStop(0, "#101728");
    g.addColorStop(0.55, "#0a0e18");
    g.addColorStop(1, "#05070c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 网格
    var step = 64;
    ctx.strokeStyle = "rgba(90,130,190,0.075)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = ((t * 14) % step) - step; x < W + step; x += step) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
    }
    for (var y = ((t * 9) % step) - step; y < H + step; y += step) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
    }
    ctx.stroke();
  }

  function drawPlayer(p, t) {
    ctx.save();
    ctx.translate(p.x, p.y);

    // 落地阴影
    ctx.beginPath();
    ctx.arc(0, 4, p.r + 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fill();

    var bodyAlpha = p.invuln > 0 ? 0.35 : 1;

    ctx.save();
    ctx.rotate(p.aim);
    // 枪管
    ctx.fillStyle = "rgba(190,215,245,1)";
    ctx.fillRect(p.r - 3 - p.recoil, -3.2, 20, 6.4);
    if (p.muzzle > 0) {
      ctx.beginPath();
      ctx.arc(p.r + 19 - p.recoil, 0, 8 + p.muzzle * 60, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,235,150,0.85)";
      ctx.fill();
    }
    ctx.restore();

    // 身体
    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, Math.PI * 2);
    var pg = ctx.createRadialGradient(-4, -5, 2, 0, 0, p.r + 2);
    pg.addColorStop(0, "rgba(190,245,255," + bodyAlpha + ")");
    pg.addColorStop(1, "rgba(60,150,220," + (bodyAlpha * 0.9) + ")");
    ctx.fillStyle = pg;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(150,235,255," + (bodyAlpha * 0.9) + ")";
    ctx.stroke();

    // 朝向小三角
    ctx.save();
    ctx.rotate(p.aim);
    ctx.beginPath();
    ctx.moveTo(p.r - 1, 0);
    ctx.lineTo(p.r - 9, -5);
    ctx.lineTo(p.r - 9, 5);
    ctx.closePath();
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fill();
    ctx.restore();

    ctx.restore();

    // 冲刺冷却环
    if (p.dashCd > 0) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 8, -Math.PI / 2, -Math.PI / 2 + (1 - p.dashCd / 1.25) * Math.PI * 2);
      ctx.strokeStyle = "rgba(124,231,255,0.5)";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);

    ctx.beginPath();
    ctx.arc(0, 5, e.r + 2, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fill();

    var base = e.hurt > 0 ? "#ffffff" : e.color;
    ctx.beginPath();
    ctx.arc(0, 0, e.r, 0, Math.PI * 2);
    var eg = ctx.createRadialGradient(-e.r * 0.3, -e.r * 0.35, 1, 0, 0, e.r + 1);
    eg.addColorStop(0, e.glow);
    eg.addColorStop(1, base);
    ctx.fillStyle = eg;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.stroke();

    // 血条
    if (e.hp < e.maxHp) {
      var w = e.r * 2;
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(-w / 2, -e.r - 9, w, 4);
      ctx.fillStyle = "#ff5b5b";
      ctx.fillRect(-w / 2, -e.r - 9, w * (e.hp / e.maxHp), 4);
    }
    ctx.restore();
  }

  function drawHUD(t) {
    var p = game.player;

    // 血条
    var bw = 244, bh = 14, bx = 24, by = 24;
    ctx.fillStyle = "rgba(255,255,255,0.09)";
    ctx.fillRect(bx, by, bw, bh);
    var hpr = clamp(p.hp / p.maxHp, 0, 1);
    var hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    if (hpr > 0.35) { hg.addColorStop(0, "#2ee6a8"); hg.addColorStop(1, "#8ff7d0"); }
    else { hg.addColorStop(0, "#ff3b3b"); hg.addColorStop(1, "#ff9b6b"); }
    ctx.fillStyle = hg;
    ctx.fillRect(bx, by, bw * hpr, bh);
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw, bh);

    ctx.font = "600 12px ui-monospace, Consolas, monospace";
    ctx.fillStyle = "rgba(230,245,255,0.85)";
    ctx.textAlign = "left";
    ctx.fillText("HP " + Math.max(0, Math.ceil(p.hp)) + " / " + p.maxHp, bx, by + bh + 18);

    // 分数 / 波次 / 击杀
    ctx.textAlign = "right";
    ctx.font = "700 26px ui-monospace, Consolas, monospace";
    ctx.fillStyle = "#eaf6ff";
    ctx.fillText(String(game.score).padStart(5, "0"), W - 24, 46);
    ctx.font = "500 12px ui-monospace, Consolas, monospace";
    ctx.fillStyle = "rgba(180,205,230,0.7)";
    ctx.fillText("WAVE " + game.wave + "   KILLS " + game.kills, W - 24, 66);

    // 准星
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.strokeStyle = "rgba(140,235,255,0.9)";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-16, 0); ctx.lineTo(-6, 0);
    ctx.moveTo(16, 0); ctx.lineTo(6, 0);
    ctx.moveTo(0, -16); ctx.lineTo(0, -6);
    ctx.moveTo(0, 16); ctx.lineTo(0, 6);
    ctx.stroke();
    ctx.fillStyle = "rgba(140,235,255,0.9)";
    ctx.fillRect(-1.5, -1.5, 3, 3);
    ctx.restore();

    // 波次横幅
    if (game.bannerTime > 0) {
      var a = Math.min(1, game.bannerTime / 0.4);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = "center";
      ctx.font = "800 52px ui-monospace, Consolas, monospace";
      ctx.fillStyle = "rgba(235,250,255,0.95)";
      ctx.fillText(game.banner, W / 2, H * 0.24);
      ctx.font = "500 13px ui-monospace, Consolas, monospace";
      ctx.fillStyle = "rgba(150,200,235,0.8)";
      ctx.fillText("ENEMIES INCOMING", W / 2, H * 0.24 + 26);
      ctx.restore();
    }
  }

  function drawOverlay() {
    if (game.state === "menu") {
      ctx.fillStyle = "rgba(5,8,14,0.78)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 62px ui-monospace, Consolas, monospace";
      ctx.fillText("围 城", W / 2, H / 2 - 60);
      ctx.font = "500 15px ui-monospace, Consolas, monospace";
      ctx.fillStyle = "rgba(160,205,240,0.85)";
      ctx.fillText("WASD 移动 · 鼠标瞄准 · 左键射击 · Shift 冲刺 · Esc 暂停", W / 2, H / 2 - 14);
      ctx.font = "600 16px ui-monospace, Consolas, monospace";
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      var pulse = 0.55 + Math.sin(performance.now() / 320) * 0.45;
      ctx.globalAlpha = pulse;
      ctx.fillText("点击屏幕开始", W / 2, H / 2 + 44);
      ctx.globalAlpha = 1;
    } else if (game.state === "paused") {
      ctx.fillStyle = "rgba(5,8,14,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 44px ui-monospace, Consolas, monospace";
      ctx.fillText("已暂停", W / 2, H / 2 - 6);
      ctx.font = "500 14px ui-monospace, Consolas, monospace";
      ctx.fillStyle = "rgba(160,205,240,0.8)";
      ctx.fillText("按 Esc 继续", W / 2, H / 2 + 28);
    } else if (game.state === "over") {
      ctx.fillStyle = "rgba(10,4,6,0.82)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff6b6b";
      ctx.font = "800 56px ui-monospace, Consolas, monospace";
      ctx.fillText("阵 亡", W / 2, H / 2 - 70);

      ctx.fillStyle = "#eef8ff";
      ctx.font = "700 30px ui-monospace, Consolas, monospace";
      ctx.fillText("得分 " + game.score, W / 2, H / 2 - 10);

      ctx.font = "500 14px ui-monospace, Consolas, monospace";
      ctx.fillStyle = "rgba(170,200,225,0.85)";
      ctx.fillText("坚持 " + game.wave + " 波 · 击杀 " + game.kills + " · 存活 " + game.timeAlive.toFixed(1) + " 秒", W / 2, H / 2 + 22);

      ctx.font = "600 16px ui-monospace, Consolas, monospace";
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      var pulse2 = 0.55 + Math.sin(performance.now() / 320) * 0.45;
      ctx.globalAlpha = pulse2;
      ctx.fillText("点击或按 R 重新开始", W / 2, H / 2 + 68);
      ctx.globalAlpha = 1;
    }
  }

  function render(t) {
    var sx = 0, sy = 0;
    if (game.shake > 0.2) {
      sx = rand(-game.shake, game.shake) * 0.3;
      sy = rand(-game.shake, game.shake) * 0.3;
    }

    ctx.save();
    ctx.translate(sx, sy);

    drawBackground(t);

    // 补给
    for (var i = 0; i < game.pickups.length; i++) {
      var pk = game.pickups[i];
      var bob = Math.sin(pk.phase) * 3;
      ctx.save();
      ctx.translate(pk.x, pk.y + bob);
      ctx.beginPath();
      ctx.arc(0, 0, pk.r + 6, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(93,242,160,0.14)";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, pk.r, 0, Math.PI * 2);
      ctx.fillStyle = "#5df2a0";
      ctx.fill();
      ctx.fillStyle = "rgba(6,30,18,0.9)";
      ctx.fillRect(-1.8, -6, 3.6, 12);
      ctx.fillRect(-6, -1.8, 12, 3.6);
      ctx.restore();
    }

    // 粒子
    for (var j = 0; j < game.particles.length; j++) {
      var pt = game.particles[j];
      var a = clamp(pt.life / pt.maxLife, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;

    // 子弹
    for (var k = 0; k < game.bullets.length; k++) {
      var b = game.bullets[k];
      var tl = Math.hypot(b.vx, b.vy) || 1;
      var ux = b.vx / tl, uy = b.vy / tl;
      ctx.beginPath();
      ctx.moveTo(b.x - ux * 16, b.y - uy * 16);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = "rgba(255,240,180,0.5)";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = "#fff6cf";
      ctx.fill();
    }

    // 敌人
    for (var m = 0; m < game.enemies.length; m++) drawEnemy(game.enemies[m]);

    // 玩家
    if (game.player && game.state !== "over") drawPlayer(game.player, t);

    ctx.restore();

    // 受击红闪
    if (game.hitFlash > 0) {
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
      vg.addColorStop(0, "rgba(255,0,0,0)");
      vg.addColorStop(1, "rgba(255,0,0," + (game.hitFlash * 0.45) + ")");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    // 暗角
    var vg2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.85);
    vg2.addColorStop(0, "rgba(0,0,0,0)");
    vg2.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vg2;
    ctx.fillRect(0, 0, W, H);

    if (game.state !== "menu") drawHUD(t);
    drawOverlay();
  }

  // ---------- 主循环 ----------
  var last = performance.now();
  var clock = 0;

  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    clock += dt;

    if (game.state === "playing") update(dt);
    render(clock);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
