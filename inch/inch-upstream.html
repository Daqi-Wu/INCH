<!-- INCH · UPSTREAM / v1.0 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 · 逆流</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  "use strict";

  // ---------- 常量与色板 ----------
  var C = {
    bg0: "#101728", bg1: "#0a0e18", bg2: "#05070c",
    grid: "rgba(90,130,190,0.075)",
    player: "#7ce7ff",
    threat: "#ff5b5b",
    gold: "#ffd166",
    text: "#eaf6ff",
    text2: "rgba(180,205,230,0.7)",
    panel: "rgba(255,255,255,0.09)",
    line: "rgba(255,255,255,0.18)",
    mono: 'ui-monospace, Consolas, monospace'
  };

  var PW = 30, PH = 46;
  var SCROLL = 180;                 // 世界恒定向左 180px/s
  var RUN = 300;
  var JUMP_V = -580, GRAVITY = 1750;
  var DASH_TIME = 0.15, DASH_CD = 1.25, DASH_BOOST = 1.9;
  var COYOTE = 0.1, BUFFER = 0.08;
  var WATER_H = 80;
  var PLAT_MIN_W = 90, PLAT_MAX_W = 180, PLAT_H = 16;
  var GAP_MIN = 120, GAP_MAX = 260;
  var ANCHOR_EVERY = 1200, ANCHOR_TIME = 2.0;
  var PUSH_ZONE = 20, PUSH_DMG = 34;   // 被压到左边界内的摩擦损耗
  var NEUTRAL = 0.45;

  // ---------- 工具 ----------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- 画布与 DPR ----------
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 输入 ----------
  var keys = Object.create(null);
  var jumpBuffer = 0;

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
    keys[e.code] = true;
    if (e.code === "Escape") { togglePause(); return; }
    if (e.code === "KeyR" && game.state === "over") { reset(); return; }
    if ((e.code === "Enter" || e.code === "Space") && game.state === "menu") { reset(); return; }
    if (game.state === "playing" && !e.repeat) {
      if (e.code === "KeyW" || e.code === "ArrowUp" || e.code === "Space") jumpBuffer = BUFFER;
    }
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { keys = Object.create(null); jumpBuffer = 0; });

  canvas.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    if (game.state === "menu" || game.state === "over") { reset(); return; }
    if (game.state === "playing") jumpBuffer = BUFFER;
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // ---------- 状态对象 ----------
  var game = {
    state: "menu",
    player: null,
    platforms: [],
    anchors: [],
    particles: [],
    cameraX: 0,
    nextPlatX: 0,
    nextAnchorX: ANCHOR_EVERY,
    score: 0,
    anchorsUsed: 0,
    timeAlive: 0,
    shake: 0,
    hitFlash: 0,
    dashCd: 0,
    dashTime: 0,
    clock: 0
  };

  function waterY() { return H - WATER_H; }

  function makePlayer() {
    return {
      worldX: 0, y: 0, vy: 0,
      vx: 0,
      hp: 100, maxHp: 100,
      onGround: false,
      ground: null,
      coyote: 0,
      invuln: 0
    };
  }

  function reset() {
    game.state = "playing";
    game.player = makePlayer();
    game.platforms = [];
    game.anchors = [];
    game.particles = [];
    game.cameraX = 0;
    game.player.worldX = W * NEUTRAL;
    game.startX = W * NEUTRAL;
    game.player.y = H * 0.55;
    game.nextPlatX = 460;
    game.nextAnchorX = ANCHOR_EVERY;
    game.score = 0;
    game.anchorsUsed = 0;
    game.timeAlive = 0;
    game.shake = 0;
    game.hitFlash = 0;
    game.dashCd = 0;
    game.dashTime = 0;
    game.platforms.push({ x: W * NEUTRAL - 120, y: H * 0.62, w: 260, anchor: false });
    game.player.onGround = true;
    game.player.y = H * 0.62 - PH;
    jumpBuffer = 0;
  }

  function togglePause() {
    if (game.state === "playing") game.state = "paused";
    else if (game.state === "paused") game.state = "playing";
  }

  // ---------- 特效 ----------
  function burst(x, y, color, count, power) {
    for (var i = 0; i < count; i++) {
      var a = rand(0, Math.PI * 2);
      var s = rand(0.2, 1) * power;
      var life = rand(0.25, 0.7);
      game.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: life, maxLife: life,
        size: rand(1.5, 3.6), color: color
      });
    }
  }

  // ---------- 生成 ----------
  function spawnPlatform() {
    var maxY = waterY() - 130;
    var minY = H * 0.28;
    var y = clamp(game.platforms.length ? game.platforms[game.platforms.length - 1].y + rand(-110, 110) : H * 0.6, minY, maxY);
    var w = rand(PLAT_MIN_W, PLAT_MAX_W);
    var p = { x: game.nextPlatX, y: y, w: w, anchor: false };
    game.platforms.push(p);
    game.nextPlatX += w + rand(GAP_MIN, GAP_MAX);

    if (game.nextAnchorX <= p.x + w) {
      game.anchors.push({ x: p.x + w / 2, y: y, used: false, charge: 0 });
      game.nextAnchorX += ANCHOR_EVERY;
    }
  }

  // ---------- 更新 ----------
  function update(dt) {
    var p = game.player;
    game.timeAlive += dt;
    game.shake = Math.max(0, game.shake - dt * 26);
    game.hitFlash = Math.max(0, game.hitFlash - dt);
    game.dashCd = Math.max(0, game.dashCd - dt);

    game.cameraX += SCROLL * dt;

    var dir = (keys["KeyD"] || keys["ArrowRight"] ? 1 : 0) - (keys["KeyA"] || keys["ArrowLeft"] ? 1 : 0);
    p.invuln = Math.max(0, p.invuln - dt);

    if ((keys["ShiftLeft"] || keys["ShiftRight"]) && game.dashCd <= 0 && game.dashTime <= 0 && dir !== 0) {
      game.dashTime = DASH_TIME;
      game.dashCd = DASH_CD;
      p.invuln = DASH_TIME;
      burst(p.worldX - game.cameraX, p.y + PH / 2, C.player, 12, 160);
    }

    var speed = game.dashTime > 0 ? RUN * DASH_BOOST : RUN;
    if (game.dashTime > 0) game.dashTime -= dt;
    p.worldX += dir * speed * dt;

    // 跳跃
    p.coyote = p.onGround ? COYOTE : Math.max(0, p.coyote - dt);
    jumpBuffer = Math.max(0, jumpBuffer - dt);
    if (jumpBuffer > 0 && (p.onGround || p.coyote > 0)) {
      p.vy = JUMP_V;
      p.onGround = false;
      p.ground = null;
      p.coyote = 0;
      jumpBuffer = 0;
    }

    p.vy += GRAVITY * dt;
    p.y += p.vy * dt;
    p.onGround = false;

    // 平台碰撞
    for (var i = 0; i < game.platforms.length; i++) {
      var pl = game.platforms[i];
      var feet = p.y + PH;
      var prevFeet = feet - p.vy * dt;
      var overlapX = p.worldX + PW > pl.x && p.worldX < pl.x + pl.w;
      if (!overlapX) continue;
      if (p.vy >= 0 && prevFeet <= pl.y + 8 && feet >= pl.y) {
        p.y = pl.y - PH;
        p.vy = 0;
        p.onGround = true;
        p.ground = pl;
      }
    }

    // 生成与回收
    while (game.nextPlatX < game.cameraX + W + 300) spawnPlatform();
    for (var k = game.platforms.length - 1; k >= 0; k--) {
      if (game.platforms[k].x + game.platforms[k].w < game.cameraX - 200) game.platforms.splice(k, 1);
    }
    for (var m = game.anchors.length - 1; m >= 0; m--) {
      if (game.anchors[m].x < game.cameraX - 300) game.anchors.splice(m, 1);
    }

    // 锚点：站上 2s 回满血，可用一次
    var nearAnchor = null;
    for (var n = 0; n < game.anchors.length; n++) {
      var an = game.anchors[n];
      if (an.used) continue;
      if (Math.abs((p.worldX + PW / 2) - an.x) < 26 && p.onGround && Math.abs((p.y + PH) - an.y) < 6) nearAnchor = an;
    }
    if (nearAnchor) {
      nearAnchor.charge += dt;
      if (nearAnchor.charge >= ANCHOR_TIME) {
        nearAnchor.used = true;
        game.anchorsUsed++;
        p.hp = p.maxHp;
        p.invuln = 1.5;
        burst(nearAnchor.x - game.cameraX, nearAnchor.y - 20, C.gold, 16, 200);
      }
    }

    // 粒子
    for (var q = game.particles.length - 1; q >= 0; q--) {
      var pt = game.particles[q];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= Math.pow(0.02, dt);
      pt.vy *= Math.pow(0.02, dt);
      pt.life -= dt;
      if (pt.life <= 0) game.particles.splice(q, 1);
    }

    game.score = Math.max(0, Math.floor((p.worldX - game.startX) * 0.1));

    // 失败：左缘越过 x=0，或落入水面
    var screenX = p.worldX - game.cameraX;
    if (screenX < 0) { die(); return; }
    if (p.y + PH > waterY()) { die(); return; }
    var zone = W * 0.12;
    if (screenX < zone) {
      p.hp -= PUSH_DMG * dt;
      game.hitFlash = Math.min(0.6, game.hitFlash + dt * 2);
      game.shake = Math.min(game.shake + dt * 40, 8);
      if (p.hp <= 0) { die(); return; }
    }
  }

  function die() {
    game.state = "over";
    game.shake = 22;
    var sx = game.player.worldX - game.cameraX;
    burst(sx, game.player.y + PH / 2, "#ff4d4d", 60, 420);
    burst(sx, game.player.y + PH / 2, "#ffffff", 20, 260);
  }

  // ---------- 绘制 ----------
  function drawBackground() {
    var g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.max(W, H) * 0.78);
    g.addColorStop(0, C.bg0);
    g.addColorStop(0.55, C.bg1);
    g.addColorStop(1, C.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var step = 64;
    var ox = game.cameraX % step;
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = -ox; x < W + step; x += step) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
    }
    for (var y = 0; y < H + step; y += step) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
    }
    ctx.stroke();
  }

  function drawPlatforms() {
    for (var i = 0; i < game.platforms.length; i++) {
      var pl = game.platforms[i];
      var sx = pl.x - game.cameraX;
      if (sx > W + 80 || sx + pl.w < -80) continue;
      ctx.fillStyle = "rgba(255,255,255,0.06)";
      ctx.fillRect(sx, pl.y, pl.w, PLAT_H);
      ctx.fillStyle = "rgba(140,235,255,0.35)";
      ctx.fillRect(sx, pl.y, pl.w, 2);
    }

    for (var j = 0; j < game.anchors.length; j++) {
      var an = game.anchors[j];
      var ax = an.x - game.cameraX;
      if (ax < -60 || ax > W + 60) continue;
      var h = 34;
      ctx.fillStyle = an.used ? "rgba(255,209,102,0.25)" : C.gold;
      ctx.fillRect(ax - 3, an.y - h, 6, h);

      if (!an.used && an.charge > 0) {
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(ax - 20, an.y - h - 12, 40, 4);
        ctx.fillStyle = C.gold;
        ctx.fillRect(ax - 20, an.y - h - 12, 40 * (an.charge / ANCHOR_TIME), 4);
      }
    }
  }

  function drawWater() {
    var wy = waterY();
    ctx.fillStyle = "rgba(60,140,200,0.22)";
    ctx.fillRect(0, wy, W, H - wy);
    ctx.fillStyle = "rgba(140,235,255,0.55)";
    ctx.fillRect(0, wy, W, 2);
  }

  function drawPlayer() {
    var p = game.player;
    var sx = p.worldX - game.cameraX;

    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(sx + 2, p.y + PH - 4, PW - 4, 5);

    ctx.fillStyle = "rgba(124,231,255,0.14)";
    ctx.fillRect(sx - 6, p.y - 6, PW + 12, PH + 12);

    var a = p.invuln > 0 ? 0.6 : 1;
    var g = ctx.createLinearGradient(sx, p.y, sx + PW, p.y + PH);
    g.addColorStop(0, "rgba(190,239,247," + a + ")");
    g.addColorStop(1, "rgba(60,150,220," + a + ")");
    ctx.fillStyle = g;
    ctx.fillRect(sx, p.y, PW, PH);
    ctx.strokeStyle = "rgba(150,235,255,0.9)";
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 1, p.y + 1, PW - 2, PH - 2);

    if (game.dashCd > 0) {
      ctx.beginPath();
      ctx.arc(sx + PW / 2, p.y - 14, 8, -Math.PI / 2, -Math.PI / 2 + (1 - game.dashCd / DASH_CD) * Math.PI * 2);
      ctx.strokeStyle = "rgba(124,231,255,0.5)";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  }

  function drawEdgeWarning() {
    var sx = game.player.worldX - game.cameraX;
    var zone = W * 0.12;
    if (sx > zone) return;
    var a = clamp(1 - sx / zone, 0, 1);
    var g = ctx.createLinearGradient(0, 0, 70, 0);
    g.addColorStop(0, "rgba(255,91,91," + (0.45 * a) + ")");
    g.addColorStop(1, "rgba(255,91,91,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 70, H);
  }

  function drawHUD() {
    // 分数
    ctx.textAlign = "right";
    ctx.font = "700 26px " + C.mono;
    ctx.fillStyle = C.text;
    ctx.fillText(String(game.score).padStart(5, "0"), W - 24, 46);
    ctx.font = "500 12px " + C.mono;
    ctx.fillStyle = C.text2;
    ctx.fillText("DIST " + Math.floor(game.player.worldX) + "   锚点 " + game.anchorsUsed, W - 24, 66);

    // 双向条
    var bx = W / 2 - 160, by = H - 28, bw = 320, bh = 6;
    ctx.fillStyle = C.panel;
    ctx.fillRect(bx, by, bw, bh);

    var offset = (game.player.worldX - game.cameraX) - W * NEUTRAL;
    var ratio = clamp(offset / 600, -1, 1);
    ctx.fillStyle = ratio >= 0 ? C.player : C.threat;
    if (ratio >= 0) ctx.fillRect(bx + bw / 2, by, bw / 2 * ratio, bh);
    else ctx.fillRect(bx + bw / 2 + bw / 2 * ratio, by, -bw / 2 * ratio, bh);

    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillRect(bx + bw / 2 - 1, by - 2, 2, bh + 4);
  }

  function drawOverlay() {
    ctx.textAlign = "center";

    if (game.state === "menu") {
      ctx.fillStyle = "rgba(5,8,14,0.78)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 62px " + C.mono;
      ctx.letterSpacing = "0.12em";
      ctx.fillText("逆流", W / 2 + 4, H / 2 - 60);
      ctx.letterSpacing = "0px";
      ctx.font = "500 15px " + C.mono;
      ctx.fillStyle = "rgba(160,205,240,0.85)";
      ctx.fillText("A / D 移动 · W 跳跃 · Shift 冲刺 · Esc 暂停", W / 2, H / 2 - 14);
      ctx.font = "600 16px " + C.mono;
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      ctx.globalAlpha = 0.55 + Math.sin(game.clock / 0.32) * 0.45;
      ctx.fillText("点击屏幕开始", W / 2, H / 2 + 44);
      ctx.globalAlpha = 1;
    } else if (game.state === "paused") {
      ctx.fillStyle = "rgba(5,8,14,0.70)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 44px " + C.mono;
      ctx.fillText("已暂停", W / 2, H / 2 - 6);
      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(160,205,240,0.8)";
      ctx.fillText("按 Esc 继续", W / 2, H / 2 + 28);
    } else if (game.state === "over") {
      ctx.fillStyle = "rgba(10,4,6,0.82)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ff6b6b";
      ctx.font = "800 56px " + C.mono;
      ctx.fillText("阵　亡", W / 2, H / 2 - 70);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "700 30px " + C.mono;
      ctx.fillText("得分 " + game.score, W / 2, H / 2 - 10);
      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(170,200,225,0.85)";
      ctx.fillText("净进 " + Math.floor(game.player.worldX - game.startX) + " 米 · 锚点 " + game.anchorsUsed + " · 存活 " + game.timeAlive.toFixed(1) + " 秒", W / 2, H / 2 + 22);
      ctx.font = "600 16px " + C.mono;
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      ctx.globalAlpha = 0.55 + Math.sin(game.clock / 0.32) * 0.45;
      ctx.fillText("点击或按 R 重新开始", W / 2, H / 2 + 68);
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    var sx = 0, sy = 0;
    if (game.shake > 0.2) {
      sx = rand(-game.shake, game.shake) * 0.3;
      sy = rand(-game.shake, game.shake) * 0.3;
    }

    ctx.save();
    ctx.translate(sx, sy);
    drawBackground();

    if (game.state !== "menu") {
      drawPlatforms();
      drawWater();
      if (game.state !== "over") drawPlayer();
    }

    for (var j = 0; j < game.particles.length; j++) {
      var pt = game.particles[j];
      ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (game.state === "playing") drawEdgeWarning();

    if (game.state !== "menu" && game.hitFlash > 0) {
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
      vg.addColorStop(0, "rgba(255,0,0,0)");
      vg.addColorStop(1, "rgba(255,0,0," + (game.hitFlash * 0.45) + ")");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    var vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.85);
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    if (game.state !== "menu") drawHUD();
    drawOverlay();
  }

  // ---------- 主循环 ----------
  var last = performance.now();

  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    game.clock += dt;

    if (game.state === "playing") update(dt);
    render();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
