<!-- INCH · FUSE / v1.0 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 · 引信</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  "use strict";

  // ---------- 常量与色板 ----------
  var C = {
    bg0: "#101728", bg1: "#0a0e18", bg2: "#05070c",
    grid: "rgba(90,130,190,0.04)",
    player: "#7ce7ff",
    threat: "#ff5b5b",
    fast: "#ffd166",
    text: "#eaf6ff",
    text2: "rgba(180,205,230,0.7)",
    panel: "rgba(255,255,255,0.09)",
    line: "rgba(255,255,255,0.18)",
    mono: 'ui-monospace, Consolas, monospace'
  };

  var BAR_W = 420, BAR_H = 26, BAR_KEY_PAD = 16;
  var START_COUNT = 5, MAX_COUNT = 9;
  var DUR_MIN = 3.0, DUR_MAX = 6.5, DUR_STEP = 0.35, DUR_FLOOR = 2.2;
  var LEVEL_STEP = 5;          // 每熄灭 5 条升一级
  var WARN = 0.25;             // 25% 警戒线
  var WRONG_PENALTY = 1.5;
  var FLASH_TIME = 0.15;
  var SPARK_PER_FRAME = 2;

  var KEYS = [
    { code: "KeyJ", label: "J" },
    { code: "KeyK", label: "K" },
    { code: "KeyL", label: "L" },
    { code: "Semicolon", label: ";" },
    { code: "Space", label: "SPACE" }
  ];

  // ---------- 工具 ----------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- 画布与 DPR ----------
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 输入 ----------
  var keys = Object.create(null);

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
    if (e.repeat) return;
    keys[e.code] = true;

    if (e.code === "Escape") { togglePause(); return; }
    if (e.code === "KeyR" && game.state === "over") { reset(); return; }
    if ((e.code === "Enter" || e.code === "Space") && game.state === "menu") { reset(); return; }
    if (game.state === "playing" && isFuseKey(e.code)) strike(e.code);
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { keys = Object.create(null); });

  canvas.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    if (game.state === "menu" || game.state === "over") reset();
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  function isFuseKey(code) {
    for (var i = 0; i < KEYS.length; i++) if (KEYS[i].code === code) return true;
    return false;
  }

  // ---------- 状态对象 ----------
  var game = {
    state: "menu",
    fuses: [],
    flashes: [],
    sparks: [],
    burstParticles: [],
    score: 0,
    extinguished: 0,
    level: 1,
    timeAlive: 0,
    shake: 0,
    hitFlash: 0,
    clock: 0
  };

  function levelMaxDur(level) {
    return Math.max(DUR_FLOOR, DUR_MAX - (level - 1) * DUR_STEP);
  }

  function makeFuse(level, keyIndex) {
    var maxDur = levelMaxDur(level);
    var minDur = Math.max(DUR_FLOOR, maxDur * 0.46);
    var t = rand(minDur, maxDur);
    return {
      key: keyIndex,
      t: t,
      maxT: t,
      box: 0,
      jitter: Math.random() * Math.PI * 2
    };
  }

  function desiredCount(level) {
    return Math.min(MAX_COUNT, START_COUNT + (level - 1));
  }

  function shuffleKeys() {
    var pool = [0, 1, 2, 3, 4];
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    return pool;
  }

  function fillFuses() {
    var target = desiredCount(game.level);
    if (game.fuses.length === 0) {
      var pool = shuffleKeys();
      for (var i = 0; i < target; i++) {
        game.fuses.push(makeFuse(game.level, pool[i % pool.length]));
      }
      return;
    }
    while (game.fuses.length < target) {
      game.fuses.push(makeFuse(game.level, Math.floor(Math.random() * KEYS.length)));
    }
  }

  function reset() {
    game.state = "playing";
    game.fuses = [];
    game.flashes = [];
    game.sparks = [];
    game.burstParticles = [];
    game.score = 0;
    game.extinguished = 0;
    game.level = 1;
    game.timeAlive = 0;
    game.shake = 0;
    game.hitFlash = 0;
    fillFuses();
  }

  function togglePause() {
    if (game.state === "playing") game.state = "paused";
    else if (game.state === "paused") game.state = "playing";
  }

  // ---------- 特效 ----------
  function burst(x, y, color, count, power) {
    for (var i = 0; i < count; i++) {
      var a = rand(0, Math.PI * 2);
      var s = rand(0.2, 1) * power;
      var life = rand(0.25, 0.7);
      game.burstParticles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: life, maxLife: life,
        size: rand(1.5, 3.6),
        color: color
      });
    }
  }

  function spark(x, y) {
    var life = 0.4;
    game.sparks.push({
      x: x + rand(-2, 2), y: y,
      vx: rand(-14, 14), vy: rand(-46, -22),
      life: life, maxLife: life,
      size: rand(1.5, 2.6)
    });
  }

  // ---------- 操作 ----------
  function barY(index, total) {
    if (total <= 1) return H * 0.5;
    return H * 0.2 + index * (H * 0.6 / (total - 1));
  }

  function strike(code) {
    var keyIndex = -1;
    for (var i = 0; i < KEYS.length; i++) if (KEYS[i].code === code) keyIndex = i;

    // 同名键有多条时，熄灭最紧迫的那条
    var pick = -1;
    for (var j = 0; j < game.fuses.length; j++) {
      if (game.fuses[j].key !== keyIndex) continue;
      if (pick < 0 || game.fuses[j].t < game.fuses[pick].t) pick = j;
    }

    if (pick < 0) {
      // 按错：最紧迫的一条扣时间，屏幕红闪
      var soonest = 0;
      for (var k = 1; k < game.fuses.length; k++) {
        if (game.fuses[k].t < game.fuses[soonest].t) soonest = k;
      }
      if (game.fuses.length) game.fuses[soonest].t -= WRONG_PENALTY;
      game.hitFlash = 0.6;
      game.shake = Math.min(game.shake + 1.6, 9);
      return;
    }

    var f = game.fuses[pick];
    var total = game.fuses.length;
    var y = barY(pick, total);
    var endX = W / 2 - BAR_W / 2 + BAR_W;

    game.flashes.push({ y: y, life: FLASH_TIME, maxLife: FLASH_TIME });
    game.fuses.splice(pick, 1);
    game.extinguished++;
    game.score += 5;
    game.shake = Math.min(game.shake + 1.6, 9);
    burst(endX, y, "#7ce7ff", 5, 150);

    var nextLevel = 1 + Math.floor(game.extinguished / LEVEL_STEP);
    if (nextLevel > game.level) game.level = nextLevel;
    fillFuses();
  }

  function die(burnY) {
    game.state = "over";
    game.shake = 22;
    burst(W / 2 + BAR_W / 2, burnY, "#ff4d4d", 60, 420);
    burst(W / 2 + BAR_W / 2, burnY, "#ffffff", 20, 260);
  }

  // ---------- 更新 ----------
  function update(dt) {
    game.timeAlive += dt;
    game.shake = Math.max(0, game.shake - dt * 26);
    game.hitFlash = Math.max(0, game.hitFlash - dt);

    for (var i = game.fuses.length - 1; i >= 0; i--) {
      var f = game.fuses[i];
      var y = barY(i, game.fuses.length);
      spark(W / 2 + BAR_W / 2, y);
      spark(W / 2 + BAR_W / 2, y);

      f.t -= dt;
      if (f.t <= 0) { die(y); return; }
    }

    for (var j = game.flashes.length - 1; j >= 0; j--) {
      game.flashes[j].life -= dt;
      if (game.flashes[j].life <= 0) game.flashes.splice(j, 1);
    }

    for (var k = game.sparks.length - 1; k >= 0; k--) {
      var s = game.sparks[k];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= Math.pow(0.02, dt);
      s.vy *= Math.pow(0.02, dt);
      s.life -= dt;
      if (s.life <= 0) game.sparks.splice(k, 1);
    }

    for (var m = game.burstParticles.length - 1; m >= 0; m--) {
      var p = game.burstParticles[m];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(0.02, dt);
      p.vy *= Math.pow(0.02, dt);
      p.life -= dt;
      if (p.life <= 0) game.burstParticles.splice(m, 1);
    }
  }

  // ---------- 绘制 ----------
  function drawBackground() {
    var g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.max(W, H) * 0.78);
    g.addColorStop(0, C.bg0);
    g.addColorStop(0.55, C.bg1);
    g.addColorStop(1, C.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 网格：静止，透明度降到 0.04，让引信成为唯一焦点
    var step = 64;
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x < W + step; x += step) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
    }
    for (var y = 0; y < H + step; y += step) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
    }
    ctx.stroke();
  }

  function drawBars() {
    var total = game.fuses.length;
    ctx.textBaseline = "middle";
    for (var i = 0; i < total; i++) {
      var f = game.fuses[i];
      var ratio = clamp(f.t / f.maxT, 0, 1);
      var jitter = ratio <= WARN ? Math.sin(game.clock * 2 * Math.PI * 18 + f.jitter) * 1 : 0;
      var x = W / 2 - BAR_W / 2 + jitter;
      var y = barY(i, total);
      var top = y - BAR_H / 2;

      ctx.fillStyle = C.panel;
      ctx.fillRect(x, top, BAR_W, BAR_H);

      ctx.fillStyle = ratio <= WARN ? C.threat : C.fast;
      ctx.fillRect(x, top, BAR_W * ratio, BAR_H);

      ctx.strokeStyle = C.line;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, top + 0.5, BAR_W, BAR_H);

      ctx.font = "700 14px " + C.mono;
      ctx.textAlign = "left";
      ctx.fillStyle = C.text;
      ctx.fillText(KEYS[f.key].label, x + BAR_KEY_PAD, y + 0.5);
    }
  }

  function drawFlashes() {
    for (var i = 0; i < game.flashes.length; i++) {
      var fl = game.flashes[i];
      var a = fl.life / fl.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = C.player;
      ctx.fillRect(W / 2 - BAR_W / 2, fl.y - BAR_H / 2, BAR_W * a, BAR_H);
      ctx.globalAlpha = 1;
    }
  }

  function drawSparks() {
    for (var i = 0; i < game.sparks.length; i++) {
      var s = game.sparks[i];
      ctx.globalAlpha = clamp(s.life / s.maxLife, 0, 1);
      ctx.fillStyle = C.fast;
      ctx.fillRect(s.x - s.size / 2, s.y - s.size / 2, s.size, s.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawBurstParticles() {
    for (var i = 0; i < game.burstParticles.length; i++) {
      var p = game.burstParticles[i];
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.font = "500 12px " + C.mono;
    ctx.fillStyle = C.text2;
    ctx.fillText("LV " + String(game.level).padStart(2, "0") + "   熄灭 " + game.extinguished, W / 2, 32);
  }

  function drawVignette() {
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.85);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawOverlay() {
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    if (game.state === "menu") {
      ctx.fillStyle = "rgba(5,8,14,0.78)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 62px " + C.mono;
      ctx.letterSpacing = "0.12em";
      ctx.fillText("引信", W / 2 + 4, H / 2 - 60);
      ctx.letterSpacing = "0px";
      ctx.font = "500 15px " + C.mono;
      ctx.fillStyle = "rgba(160,205,240,0.85)";
      ctx.fillText("J K L ; 空格 熄灭 · Esc 暂停", W / 2, H / 2 - 14);
      ctx.font = "600 16px " + C.mono;
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      ctx.globalAlpha = 0.55 + Math.sin(game.clock / 0.32) * 0.45;
      ctx.fillText("点击屏幕开始", W / 2, H / 2 + 44);
      ctx.globalAlpha = 1;
    } else if (game.state === "paused") {
      ctx.fillStyle = "rgba(5,8,14,0.70)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 44px " + C.mono;
      ctx.fillText("已暂停", W / 2, H / 2 - 6);
      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(160,205,240,0.8)";
      ctx.fillText("按 Esc 继续", W / 2, H / 2 + 28);
    } else if (game.state === "over") {
      ctx.fillStyle = "rgba(10,4,6,0.82)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ff6b6b";
      ctx.font = "800 56px " + C.mono;
      ctx.fillText("阵　亡", W / 2, H / 2 - 70);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "700 30px " + C.mono;
      ctx.fillText("得分 " + game.score, W / 2, H / 2 - 10);
      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(170,200,225,0.85)";
      ctx.fillText("等级 " + String(game.level).padStart(2, "0") + " · 熄灭 " + game.extinguished + " 条 · 存活 " + game.timeAlive.toFixed(1) + " 秒", W / 2, H / 2 + 22);
      ctx.font = "600 16px " + C.mono;
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      ctx.globalAlpha = 0.55 + Math.sin(game.clock / 0.32) * 0.45;
      ctx.fillText("点击或按 R 重新开始", W / 2, H / 2 + 68);
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    var sx = 0, sy = 0;
    if (game.shake > 0.2) {
      sx = rand(-game.shake, game.shake) * 0.3;
      sy = rand(-game.shake, game.shake) * 0.3;
    }

    ctx.save();
    ctx.translate(sx, sy);
    drawBackground();
    if (game.state !== "menu") {
      drawBars();
      drawFlashes();
      drawSparks();
      drawBurstParticles();
    }
    ctx.restore();

    if (game.state !== "menu") {
      if (game.hitFlash > 0) {
        var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
        vg.addColorStop(0, "rgba(255,0,0,0)");
        vg.addColorStop(1, "rgba(255,0,0," + (game.hitFlash * 0.45) + ")");
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
      }
      drawVignette();
      drawHUD();
    } else {
      drawVignette();
    }
    drawOverlay();
  }

  // ---------- 主循环 ----------
  var last = performance.now();

  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    game.clock += dt;

    if (game.state === "playing") update(dt);
    render();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
