<!-- INCH · TAILLIGHT / v1.0 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 · 尾灯</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  "use strict";

  // ---------- 常量与色板 ----------
  var C = {
    bg0: "#101728", bg1: "#0a0e18", bg2: "#05070c",
    grid: "rgba(90,130,190,0.075)",
    player: "#7ce7ff",
    threat: "#ff5b5b",
    text: "#eaf6ff",
    text2: "rgba(180,205,230,0.7)",
    panel: "rgba(255,255,255,0.09)",
    line: "rgba(255,255,255,0.18)",
    mono: 'ui-monospace, Consolas, monospace'
  };

  var ROAD_W = 300, LANE_W = 100, LANES = 3;
  var CAR_W = 34, CAR_H = 54;
  var SPEED_BASE = 320, SPEED_STEP = 18, SPEED_EVERY = 10;
  var LANE_SPEED = 620;
  var CONE_HALF = 26 * Math.PI / 180, CONE_LEN = 520;
  var HULL = 3;
  var HIT_SLOW = 0.5, HIT_TIME = 1.0;
  var ROADBLOCK = 40;
  var SPAWN_GAP = 320;
  var DASH_TIME = 0.15, DASH_CD = 1.25;

  // ---------- 工具 ----------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- 画布与 DPR ----------
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var dark = document.createElement("canvas");
  var dctx = dark.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dark.width = canvas.width;
    dark.height = canvas.height;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 输入 ----------
  var keys = Object.create(null);

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
    keys[e.code] = true;
    if (e.code === "Escape") { togglePause(); return; }
    if (e.code === "KeyR" && game.state === "over") { reset(); return; }
    if ((e.code === "Enter" || e.code === "Space") && game.state === "menu") { reset(); return; }
    if (game.state === "playing" && !e.repeat) {
      if (e.code === "KeyA" || e.code === "ArrowLeft") shiftLane(-1);
      if (e.code === "KeyD" || e.code === "ArrowRight") shiftLane(1);
    }
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { keys = Object.create(null); });

  canvas.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    if (game.state === "menu" || game.state === "over") { reset(); return; }
    if (game.state === "playing") shiftLane(1);
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // ---------- 状态对象 ----------
  var game = {
    state: "menu",
    lane: 1,
    carX: 0,
    speed: SPEED_BASE,
    slowTimer: 0,
    dashTime: 0,
    dashCd: 0,
    hull: HULL,
    distance: 0,
    obstacles: [],
    particles: [],
    nextSpawnY: -400,
    score: 0,
    hits: 0,
    timeAlive: 0,
    shake: 0,
    hitFlash: 0,
    gridScroll: 0,
    clock: 0
  };

  function roadLeft() { return W / 2 - ROAD_W / 2; }
  function carY() { return H * 0.72; }
  function laneX(i) { return roadLeft() + LANE_W * i + LANE_W / 2; }

  function reset() {
    game.state = "playing";
    game.lane = 1;
    game.carX = laneX(1);
    game.speed = SPEED_BASE;
    game.slowTimer = 0;
    game.dashTime = 0;
    game.dashCd = 0;
    game.hull = HULL;
    game.distance = 0;
    game.obstacles = [];
    game.particles = [];
    game.nextSpawnY = -420;
    game.score = 0;
    game.hits = 0;
    game.timeAlive = 0;
    game.shake = 0;
    game.hitFlash = 0;
    game.gridScroll = 0;
  }

  function togglePause() {
    if (game.state === "playing") game.state = "paused";
    else if (game.state === "paused") game.state = "playing";
  }

  function shiftLane(dir) {
    game.lane = clamp(game.lane + dir, 0, LANES - 1);
  }

  // ---------- 特效 ----------
  function burst(x, y, color, count, power) {
    for (var i = 0; i < count; i++) {
      var a = rand(0, Math.PI * 2);
      var s = rand(0.2, 1) * power;
      var life = rand(0.25, 0.7);
      game.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: life, maxLife: life,
        size: rand(1.5, 3.6), color: color
      });
    }
  }

  // ---------- 生成 ----------
  function spawnObstacle() {
    var lane = Math.floor(rand(0, LANES));
    var slowCar = Math.random() < 0.45;
    game.obstacles.push({
      kind: slowCar ? "car" : "block",
      lane: lane,
      x: laneX(lane),
      y: game.nextSpawnY,
      w: slowCar ? CAR_W : ROADBLOCK,
      h: slowCar ? CAR_H : ROADBLOCK,
      speed: slowCar ? game.speed * rand(0.35, 0.55) : 0,
      done: false
    });
    game.nextSpawnY -= SPAWN_GAP + rand(0, 260);
  }

  // ---------- 更新 ----------
  function update(dt) {
    game.timeAlive += dt;
    game.shake = Math.max(0, game.shake - dt * 26);
    game.hitFlash = Math.max(0, game.hitFlash - dt);
    game.dashCd = Math.max(0, game.dashCd - dt);

    var base = SPEED_BASE + Math.floor(game.timeAlive / SPEED_EVERY) * SPEED_STEP;
    game.slowTimer = Math.max(0, game.slowTimer - dt);
    game.dashTime = Math.max(0, game.dashTime - dt);

    var factor = 1;
    if (game.slowTimer > 0) factor = HIT_SLOW;
    if (game.dashTime > 0) factor = 1.7;
    game.speed = base * factor;

    game.distance += game.speed * dt;
    game.gridScroll += game.speed * dt;

    // 变道：匀速直线靠向目标车道
    var target = laneX(game.lane);
    var dx = target - game.carX;
    var step = LANE_SPEED * dt;
    game.carX += clamp(dx, -step, step);

    // 冲刺
    if ((keys["ShiftLeft"] || keys["ShiftRight"]) && game.dashCd <= 0 && game.dashTime <= 0) {
      game.dashTime = DASH_TIME;
      game.dashCd = DASH_CD;
      burst(game.carX, carY(), C.player, 12, 160);
    }

    // 障碍推进
    game.nextSpawnY += game.speed * dt;
    while (game.nextSpawnY > -140) spawnObstacle();

    for (var i = game.obstacles.length - 1; i >= 0; i--) {
      var o = game.obstacles[i];
      var rel = game.speed - o.speed;
      o.y += rel * dt;
      if (o.y > H + 200) { game.obstacles.splice(i, 1); continue; }
      if (o.done) continue;

      var carL = game.carX - CAR_W / 2, carR = game.carX + CAR_W / 2;
      var carT = carY() - CAR_H / 2, carB = carY() + CAR_H / 2;
      var oL = o.x - o.w / 2, oR = o.x + o.w / 2;
      var oT = o.y - o.h / 2, oB = o.y + o.h / 2;
      if (carR > oL && carL < oR && carB > oT && carT < oB) {
        o.done = true;
        crash(o);
      }
    }

    // 粒子
    for (var m = game.particles.length - 1; m >= 0; m--) {
      var pt = game.particles[m];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= Math.pow(0.02, dt);
      pt.vy *= Math.pow(0.02, dt);
      pt.life -= dt;
      if (pt.life <= 0) game.particles.splice(m, 1);
    }

    game.score = Math.floor(game.distance * 0.05);
  }

  function crash(o) {
    game.hull--;
    game.hits++;
    game.slowTimer = HIT_TIME;
    game.shake = Math.min(game.shake + 12, 16);
    game.hitFlash = 0.6;
    burst(game.carX, carY() - CAR_H / 2, "#ff4d4d", 14, 220);
    if (game.hull <= 0) die();
  }

  function die() {
    game.state = "over";
    game.shake = 22;
    burst(game.carX, carY(), "#ff4d4d", 60, 420);
    burst(game.carX, carY(), "#ffffff", 20, 260);
  }

  // ---------- 绘制 ----------
  function drawBackground() {
    var g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.max(W, H) * 0.78);
    g.addColorStop(0, C.bg0);
    g.addColorStop(0.55, C.bg1);
    g.addColorStop(1, C.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var step = 64;
    var oy = game.gridScroll % step;
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x < W + step; x += step) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
    }
    for (var y = -oy; y < H + step; y += step) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
    }
    ctx.stroke();
  }

  function drawRoad() {
    var left = roadLeft();
    ctx.fillStyle = "rgba(255,255,255,0.04)";
    ctx.fillRect(left, 0, ROAD_W, H);

    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.round(left) + 0.5, 0);
    ctx.lineTo(Math.round(left) + 0.5, H);
    ctx.moveTo(Math.round(left + ROAD_W) + 0.5, 0);
    ctx.lineTo(Math.round(left + ROAD_W) + 0.5, H);
    ctx.stroke();

    // 车道虚线
    var dashLen = 44, gap = 40;
    var oy = game.gridScroll % (dashLen + gap);
    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.lineWidth = 2;
    for (var lane = 1; lane < LANES; lane++) {
      var lx = left + LANE_W * lane;
      for (var y = -oy; y < H + dashLen; y += dashLen + gap) {
        ctx.beginPath();
        ctx.moveTo(lx, y);
        ctx.lineTo(lx, y + dashLen);
        ctx.stroke();
      }
    }
  }

  function drawObstacles() {
    for (var i = 0; i < game.obstacles.length; i++) {
      var o = game.obstacles[i];
      var x = o.x - o.w / 2, y = o.y - o.h / 2;

      if (o.kind === "block") {
        ctx.fillStyle = "rgba(255,91,91,0.30)";
        ctx.fillRect(x, y, o.w, o.h);
        ctx.strokeStyle = "rgba(255,155,155,0.85)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, o.w - 2, o.h - 2);
      } else {
        ctx.fillStyle = "rgba(255,255,255,0.10)";
        ctx.fillRect(x, y, o.w, o.h);
        ctx.strokeStyle = "rgba(255,255,255,0.22)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, o.w - 2, o.h - 2);
      }
    }
  }

  function drawTaillights() {
    // 尾灯画在黑暗之上：这是锥外唯一的信息来源
    for (var i = 0; i < game.obstacles.length; i++) {
      var o = game.obstacles[i];
      if (o.kind !== "car") continue;
      var y = o.y + o.h / 2 - 6;
      if (y < -20 || y > H + 20) continue;
      for (var s = -1; s <= 1; s += 2) {
        var x = o.x + s * (o.w / 2 - 7);
        ctx.beginPath();
        ctx.arc(x, y, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,91,91,0.16)";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, 2.4, 0, Math.PI * 2);
        ctx.fillStyle = C.threat;
        ctx.fill();
      }
    }
  }

  function drawCar() {
    var x = game.carX - CAR_W / 2;
    var y = carY() - CAR_H / 2;

    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(x + 2, y + 4, CAR_W - 4, CAR_H - 4);

    ctx.fillStyle = "rgba(124,231,255,0.14)";
    ctx.fillRect(x - 6, y - 6, CAR_W + 12, CAR_H + 12);

    var g = ctx.createLinearGradient(x, y, x + CAR_W, y + CAR_H);
    g.addColorStop(0, "#beeff7");
    g.addColorStop(1, "#3c96dc");
    ctx.fillStyle = g;
    ctx.fillRect(x, y, CAR_W, CAR_H);
    ctx.strokeStyle = "rgba(150,235,255,0.9)";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, CAR_W - 2, CAR_H - 2);

    // 前灯
    ctx.fillStyle = "rgba(255,246,207,0.9)";
    ctx.fillRect(x + 4, y + 2, 8, 4);
    ctx.fillRect(x + CAR_W - 12, y + 2, 8, 4);
  }

  function drawDarkness() {
    dctx.setTransform(1, 0, 0, 1, 0, 0);
    dctx.clearRect(0, 0, dark.width, dark.height);
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    dctx.fillStyle = "rgba(0,0,0,0.94)";
    dctx.fillRect(0, 0, W, H);

    dctx.globalCompositeOperation = "destination-out";
    dctx.save();
    dctx.beginPath();
    dctx.moveTo(game.carX, carY());
    dctx.arc(game.carX, carY(), CONE_LEN, -Math.PI / 2 - CONE_HALF, -Math.PI / 2 + CONE_HALF);
    dctx.closePath();
    dctx.clip();

    var g = dctx.createRadialGradient(game.carX, carY(), 14, game.carX, carY(), CONE_LEN);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(0.62, "rgba(0,0,0,0.82)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    dctx.fillStyle = g;
    dctx.fillRect(0, 0, W, H);
    dctx.restore();
    dctx.globalCompositeOperation = "source-over";

    ctx.drawImage(dark, 0, 0, W, H);
  }

  function drawHUD() {
    // 车损格
    for (var i = 0; i < HULL; i++) {
      var x = 24 + i * 32, y = 27;
      if (i < game.hull) {
        ctx.fillStyle = C.player;
        ctx.fillRect(x, y, 24, 14);
      } else {
        ctx.fillStyle = "rgba(255,91,91,0.12)";
        ctx.fillRect(x, y, 24, 14);
        ctx.strokeStyle = "rgba(255,91,91,0.5)";
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, 24, 14);
      }
    }
    ctx.font = "500 12px " + C.mono;
    ctx.fillStyle = C.text2;
    ctx.textAlign = "left";
    ctx.fillText("HULL " + Math.max(0, game.hull) + " / " + HULL, 24, 62);

    // 分数
    ctx.textAlign = "right";
    ctx.font = "700 26px " + C.mono;
    ctx.fillStyle = C.text;
    ctx.fillText(String(game.score).padStart(5, "0"), W - 24, 46);
    ctx.font = "500 12px " + C.mono;
    ctx.fillStyle = C.text2;
    ctx.fillText("DIST " + Math.floor(game.distance) + "   HIT " + game.hits, W - 24, 66);

    // 速度表
    var sx = W - 96, sy = H - 60;
    var ratio = clamp((game.speed - SPEED_BASE) / 400, 0, 1);
    ctx.strokeStyle = "rgba(255,255,255,0.09)";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(sx, sy, 60, Math.PI, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = C.player;
    ctx.beginPath();
    ctx.arc(sx, sy, 60, Math.PI, Math.PI + Math.PI * ratio);
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.font = "700 26px " + C.mono;
    ctx.fillStyle = C.text;
    ctx.fillText(String(Math.round(game.speed)), sx, sy - 10);
  }

  function drawOverlay() {
    ctx.textAlign = "center";

    if (game.state === "menu") {
      ctx.fillStyle = "rgba(5,8,14,0.78)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 62px " + C.mono;
      ctx.letterSpacing = "0.12em";
      ctx.fillText("尾灯", W / 2 + 4, H / 2 - 60);
      ctx.letterSpacing = "0px";
      ctx.font = "500 15px " + C.mono;
      ctx.fillStyle = "rgba(160,205,240,0.85)";
      ctx.fillText("A / D 变道 · Shift 冲刺 · Esc 暂停", W / 2, H / 2 - 14);
      ctx.font = "600 16px " + C.mono;
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      ctx.globalAlpha = 0.55 + Math.sin(game.clock / 0.32) * 0.45;
      ctx.fillText("点击屏幕开始", W / 2, H / 2 + 44);
      ctx.globalAlpha = 1;
    } else if (game.state === "paused") {
      ctx.fillStyle = "rgba(5,8,14,0.70)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 44px " + C.mono;
      ctx.fillText("已暂停", W / 2, H / 2 - 6);
      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(160,205,240,0.8)";
      ctx.fillText("按 Esc 继续", W / 2, H / 2 + 28);
    } else if (game.state === "over") {
      ctx.fillStyle = "rgba(10,4,6,0.82)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ff6b6b";
      ctx.font = "800 56px " + C.mono;
      ctx.fillText("阵　亡", W / 2, H / 2 - 70);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "700 30px " + C.mono;
      ctx.fillText("得分 " + game.score, W / 2, H / 2 - 10);
      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(170,200,225,0.85)";
      ctx.fillText("里程 " + Math.floor(game.distance) + " 米 · 碰撞 " + game.hits + " · 存活 " + game.timeAlive.toFixed(1) + " 秒", W / 2, H / 2 + 22);
      ctx.font = "600 16px " + C.mono;
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      ctx.globalAlpha = 0.55 + Math.sin(game.clock / 0.32) * 0.45;
      ctx.fillText("点击或按 R 重新开始", W / 2, H / 2 + 68);
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    var sx = 0, sy = 0;
    if (game.shake > 0.2) {
      sx = rand(-game.shake, game.shake) * 0.3;
      sy = rand(-game.shake, game.shake) * 0.3;
    }

    ctx.save();
    ctx.translate(sx, sy);
    drawBackground();

    if (game.state !== "menu") {
      drawRoad();
      drawObstacles();
      drawDarkness();
      drawTaillights();
      if (game.state !== "over") drawCar();
    }

    for (var j = 0; j < game.particles.length; j++) {
      var pt = game.particles[j];
      ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    var vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.85);
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    if (game.state !== "menu" && game.hitFlash > 0) {
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
      vg.addColorStop(0, "rgba(255,0,0,0)");
      vg.addColorStop(1, "rgba(255,0,0," + (game.hitFlash * 0.45) + ")");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    if (game.state !== "menu") drawHUD();
    drawOverlay();
  }

  // ---------- 主循环 ----------
  var last = performance.now();

  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    game.clock += dt;

    if (game.state === "playing") update(dt);
    render();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
