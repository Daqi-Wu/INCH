<!-- INCH · ALLEY / v1.0 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 · 空巷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  "use strict";

  // ---------- 常量与色板 ----------
  var C = {
    bg0: "#101728", bg1: "#0a0e18", bg2: "#05070c",
    grid: "rgba(90,130,190,0.075)",
    player: "#7ce7ff",
    threat: "#ff5b5b",
    text: "#eaf6ff",
    text2: "rgba(180,205,230,0.7)",
    panel: "rgba(255,255,255,0.09)",
    line: "rgba(255,255,255,0.18)",
    mono: 'ui-monospace, Consolas, monospace'
  };

  var PW = 34, PH = 54, PH_SLIDE = 28;
  var BASE_SPEED = 320, SPEED_PER_100M = 4;
  var JUMP_V = -640, JUMP2_V = -520, GRAVITY = 1900;
  var SLIDE_TIME = 0.45, SLIDE_CD = 0.6;
  var DASH_TIME = 0.15, DASH_CD = 1.25, DASH_BOOST = 1.6;
  var WALL_START_GAP = 200, WALL_WIDTH = 40;
  var WALL_FACTOR = 1.055;      // 墙速 = 标准跑速 × 1.055
  var CLEAN_FACTOR = 1.06;      // 顺畅奔跑时略快于墙，墙距回到 200
  var HIT_FACTOR = 0.55, HIT_TIME = 0.8;
  var GAP_BUFFER = 0.08, COYOTE = 0.1;
  var SPAWN_MIN = 380, SPAWN_MAX = 620;
  var PLAYER_SCREEN_X = 0.42;   // 玩家固定在屏宽的 42%

  // ---------- 工具 ----------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- 画布与 DPR ----------
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 输入 ----------
  var keys = Object.create(null);
  var jumpBuffer = 0;

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
    keys[e.code] = true;

    if (e.code === "Escape") { togglePause(); return; }
    if (e.code === "KeyR" && game.state === "over") { reset(); return; }
    if ((e.code === "Enter" || e.code === "Space") && game.state === "menu") { reset(); return; }

    if (game.state === "playing" && !e.repeat) {
      if (e.code === "KeyW" || e.code === "ArrowUp" || e.code === "Space") jumpBuffer = GAP_BUFFER;
      if (e.code === "KeyS" || e.code === "ArrowDown") trySlide();
    }
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { keys = Object.create(null); jumpBuffer = 0; });

  canvas.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    if (game.state === "menu" || game.state === "over") { reset(); return; }
    if (game.state === "playing") jumpBuffer = GAP_BUFFER;
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // ---------- 状态对象 ----------
  var game = {
    state: "menu",
    worldX: 0,
    gap: WALL_START_GAP,
    speed: BASE_SPEED,
    peakSpeed: BASE_SPEED,
    hitTimer: 0,
    dashTimer: 0,
    dashCd: 0,
    obstacles: [],
    nextSpawnX: 0,
    player: null,
    score: 0,
    timeAlive: 0,
    shake: 0,
    hitFlash: 0,
    clock: 0
  };

  function groundY() { return H * 0.74; }
  function playerScreenX() { return W * PLAYER_SCREEN_X; }

  function makePlayer() {
    return {
      height: PH,
      offsetY: 0,        // 脚离地高度
      vy: 0,
      onGround: true,
      jumps: 0,
      coyote: 0,
      slideTimer: 0,
      slideCd: 0,
      aimless: true
    };
  }

  function reset() {
    game.state = "playing";
    game.worldX = 0;
    game.gap = WALL_START_GAP;
    game.speed = BASE_SPEED;
    game.peakSpeed = BASE_SPEED;
    game.hitTimer = 0;
    game.dashTimer = 0;
    game.dashCd = 0;
    game.obstacles = [];
    game.nextSpawnX = 520;
    game.particles = [];
    game.player = makePlayer();
    game.score = 0;
    game.timeAlive = 0;
    game.shake = 0;
    game.hitFlash = 0;
    jumpBuffer = 0;
  }

  function togglePause() {
    if (game.state === "playing") game.state = "paused";
    else if (game.state === "paused") game.state = "playing";
  }

  function nominalSpeed() {
    return BASE_SPEED + Math.floor(game.worldX / 100) * SPEED_PER_100M;
  }

  function trySlide() {
    var p = game.player;
    if (!p.onGround || p.slideCd > 0) return;
    p.slideTimer = SLIDE_TIME;
    p.slideCd = SLIDE_CD;
    p.height = PH_SLIDE;
  }

  // ---------- 特效 ----------
  function burst(x, y, color, count, power) {
    for (var i = 0; i < count; i++) {
      var a = rand(0, Math.PI * 2);
      var s = rand(0.2, 1) * power;
      var life = rand(0.25, 0.7);
      game.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: life, maxLife: life,
        size: rand(1.5, 3.6), color: color
      });
    }
  }
  game.particles = [];

  // ---------- 障碍 ----------
  function spawnObstacle(worldX) {
    var roll = Math.random();
    var gy = groundY();
    if (roll < 0.42) {
      game.obstacles.push({ type: "low", x: worldX, w: 44, h: 46, top: gy - 46, done: false });
    } else if (roll < 0.76) {
      // 悬空管道：下沿离地 44px，只有滑铲能过；顶端高到二段跳也跨不过去
      game.obstacles.push({ type: "pipe", x: worldX, w: 56, h: 196, top: gy - 240, done: false });
    } else {
      var gw = rand(70, 130);
      game.obstacles.push({ type: "pit", x: worldX, w: gw, h: 0, top: gy, done: false });
    }
  }

  // ---------- 更新 ----------
  function update(dt) {
    var p = game.player;
    var gy = groundY();
    game.timeAlive += dt;
    game.shake = Math.max(0, game.shake - dt * 26);
    game.hitFlash = Math.max(0, game.hitFlash - dt);

    var nominal = nominalSpeed();
    game.hitTimer = Math.max(0, game.hitTimer - dt);
    game.dashCd = Math.max(0, game.dashCd - dt);
    p.slideCd = Math.max(0, p.slideCd - dt);

    // 冲刺
    if ((keys["ShiftLeft"] || keys["ShiftRight"]) && game.dashCd <= 0 && game.dashTimer <= 0) {
      game.dashTimer = DASH_TIME;
      game.dashCd = DASH_CD;
      burst(playerScreenX(), gy - p.height / 2, C.player, 12, 160);
    }
    if (game.dashTimer > 0) game.dashTimer -= dt;

    // 速度：顺畅略快于墙，撞障碍掉到 0.55 倍，墙不减速
    var factor = 1;
    if (game.hitTimer > 0) factor = HIT_FACTOR;
    else factor = CLEAN_FACTOR;
    if (game.dashTimer > 0) factor = DASH_BOOST;

    game.speed = nominal * factor;
    if (game.speed > game.peakSpeed) game.peakSpeed = game.speed;

    var wallSpeed = nominal * WALL_FACTOR;
    game.gap = Math.min(WALL_START_GAP, game.gap + (game.speed - wallSpeed) * dt);

    game.worldX += game.speed * dt;

    // 跳跃
    p.coyote = p.onGround ? COYOTE : Math.max(0, p.coyote - dt);
    jumpBuffer = Math.max(0, jumpBuffer - dt);
    if (jumpBuffer > 0) {
      if (p.onGround || p.coyote > 0) {
        p.vy = JUMP_V;
        p.onGround = false;
        p.coyote = 0;
        p.jumps = 1;
        p.slideTimer = 0;
        p.height = PH;
        jumpBuffer = 0;
      } else if (p.jumps < 2) {
        p.vy = JUMP2_V;
        p.jumps = 2;
        jumpBuffer = 0;
        burst(playerScreenX(), gy - p.offsetY - p.height, C.player, 6, 120);
      }
    }

    p.vy += GRAVITY * dt;
    p.offsetY -= p.vy * dt;
    if (p.offsetY <= 0) {
      p.offsetY = 0;
      p.vy = 0;
      if (!p.onGround) p.jumps = 0;
      p.onGround = true;
    }

    if (p.slideTimer > 0) {
      p.slideTimer -= dt;
      if (p.slideTimer <= 0) p.height = PH;
    } else {
      p.height = PH;
    }

    // 生成障碍
    while (game.nextSpawnX < game.worldX + W) {
      spawnObstacle(game.nextSpawnX);
      game.nextSpawnX += rand(SPAWN_MIN, SPAWN_MAX);
    }

    // 碰撞
    var pxLeft = playerScreenX() - PW / 2;
    var pxRight = playerScreenX() + PW / 2;
    var pBottom = gy - p.offsetY;
    var pTop = pBottom - p.height;

    for (var i = game.obstacles.length - 1; i >= 0; i--) {
      var o = game.obstacles[i];
      var ox = o.x - game.worldX + playerScreenX();
      if (ox + o.w < -80) { game.obstacles.splice(i, 1); continue; }
      if (o.done || game.dashTimer > 0) continue;

      if (o.type === "pit") {
        // 地缝：脚还在地上且踩进缝里就算撞
        if (p.onGround && pxRight > ox && pxLeft < ox + o.w) {
          o.done = true;
          punish();
        }
        continue;
      }

      var oLeft = ox, oRight = ox + o.w, oTop = o.top, oBottom = o.top + o.h;
      var overlapX = pxRight > oLeft && pxLeft < oRight;
      var overlapY = pBottom > oTop + 2 && pTop < oBottom;
      if (overlapX && overlapY) {
        o.done = true;
        punish();
      }
    }

    // 粒子
    for (var m = game.particles.length - 1; m >= 0; m--) {
      var pt = game.particles[m];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= Math.pow(0.02, dt);
      pt.vy *= Math.pow(0.02, dt);
      pt.life -= dt;
      if (pt.life <= 0) game.particles.splice(m, 1);
    }

    game.score = Math.floor(game.worldX);

    // 失败：墙的右缘越过玩家右缘
    var wallRight = pxLeft - game.gap;
    if (wallRight >= pxRight) die();
  }

  function punish() {
    game.hitTimer = HIT_TIME;
    game.shake = Math.min(game.shake + 8, 16);
    game.hitFlash = 0.6;
    burst(playerScreenX(), groundY() - game.player.height / 2, "#ff4d4d", 14, 220);
  }

  function die() {
    game.state = "over";
    game.shake = 22;
    burst(playerScreenX(), groundY() - game.player.height / 2, "#ff4d4d", 60, 420);
    burst(playerScreenX(), groundY() - game.player.height / 2, "#ffffff", 20, 260);
  }

  // ---------- 绘制 ----------
  function drawBackground() {
    var g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.max(W, H) * 0.78);
    g.addColorStop(0, C.bg0);
    g.addColorStop(0.55, C.bg1);
    g.addColorStop(1, C.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 网格：水平滚动，速度实时等于跑速
    var step = 64;
    var ox = (game.worldX % step);
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = -ox; x < W + step; x += step) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
    }
    for (var y = 0; y < H + step; y += step) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
    }
    ctx.stroke();
  }

  function drawGround() {
    var gy = groundY();
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(0, gy, W, H - gy);
    ctx.strokeStyle = "rgba(140,235,255,0.35)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();
  }

  function drawObstacles() {
    var gy = groundY();
    for (var i = 0; i < game.obstacles.length; i++) {
      var o = game.obstacles[i];
      var ox = o.x - game.worldX + playerScreenX();

      if (o.type === "pit") {
        ctx.fillStyle = "rgba(0,0,0,0.9)";
        ctx.fillRect(ox, gy, o.w, H - gy);
        ctx.fillStyle = "rgba(255,91,91,0.35)";
        ctx.fillRect(ox, gy, o.w, 2);
        continue;
      }

      ctx.fillStyle = o.type === "pipe" ? "rgba(160,120,255,0.18)" : "rgba(255,91,91,0.18)";
      ctx.fillRect(ox, o.top, o.w, o.h);
      ctx.strokeStyle = o.type === "pipe" ? "rgba(214,194,255,0.7)" : "rgba(255,155,155,0.7)";
      ctx.lineWidth = 2;
      ctx.strokeRect(ox + 1, o.top + 1, o.w - 2, o.h - 2);
    }
  }

  function drawWall() {
    var pxLeft = playerScreenX() - PW / 2;
    var wallRight = pxLeft - game.gap;
    if (wallRight <= 0) return;

    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, wallRight, H);

    // 边缘红噪点
    for (var i = 0; i < 30; i++) {
      var nx = wallRight - rand(0, 48);
      var ny = rand(0, H);
      var s = rand(1, 2.5);
      ctx.globalAlpha = rand(0.15, 0.6);
      ctx.fillStyle = C.threat;
      ctx.fillRect(nx, ny, s, s);
    }
    ctx.globalAlpha = 1;

    // 3px 边缘抖动
    var jitter = rand(-1.5, 1.5);
    ctx.fillStyle = "rgba(255,91,91,0.75)";
    ctx.fillRect(wallRight + jitter - 1.5, 0, 3, H);
  }

  function drawPlayer() {
    var p = game.player;
    var gy = groundY();
    var cx = playerScreenX();
    var bottom = gy - p.offsetY;
    var top = bottom - p.height;
    var x = cx - PW / 2;

    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(x + 2, gy - 3, PW - 4, 5);

    ctx.fillStyle = "rgba(124,231,255,0.14)";
    ctx.fillRect(x - 6, top - 6, PW + 12, p.height + 12);

    var g = ctx.createLinearGradient(x, top, x + PW, bottom);
    g.addColorStop(0, "#beeff7");
    g.addColorStop(1, "#3c96dc");
    ctx.fillStyle = g;
    ctx.fillRect(x, top, PW, p.height);

    ctx.strokeStyle = "rgba(150,235,255,0.9)";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, top + 1, PW - 2, p.height - 2);
  }

  function drawHUD() {
    // 墙距条
    var ratio = clamp(game.gap / WALL_START_GAP, 0, 1);
    var w = 320 * ratio;
    var x = W / 2 - w / 2;
    ctx.fillStyle = "rgba(255,255,255,0.09)";
    ctx.fillRect(W / 2 - 160, 24, 320, 6);
    var close = game.gap < 60;
    var blink = close ? (Math.floor(game.clock * 12) % 2 === 0 ? 1 : 0.25) : 1;
    ctx.globalAlpha = blink;
    ctx.fillStyle = close ? C.threat : C.text;
    ctx.fillRect(x, 24, w, 6);
    ctx.globalAlpha = 1;

    // 分数
    ctx.textAlign = "right";
    ctx.font = "700 26px " + C.mono;
    ctx.fillStyle = C.text;
    ctx.fillText(String(game.score).padStart(5, "0"), W - 24, 46);
    ctx.font = "500 12px " + C.mono;
    ctx.fillStyle = C.text2;
    ctx.fillText("DIST " + game.score + "   SPEED " + Math.round(game.speed), W - 24, 66);
  }

  function drawOverlay() {
    ctx.textAlign = "center";

    if (game.state === "menu") {
      ctx.fillStyle = "rgba(5,8,14,0.78)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 62px " + C.mono;
      ctx.letterSpacing = "0.12em";
      ctx.fillText("空巷", W / 2 + 4, H / 2 - 60);
      ctx.letterSpacing = "0px";
      ctx.font = "500 15px " + C.mono;
      ctx.fillStyle = "rgba(160,205,240,0.85)";
      ctx.fillText("W / ↑ 跳跃 · S / ↓ 滑铲 · Shift 冲刺 · Esc 暂停", W / 2, H / 2 - 14);
      ctx.font = "600 16px " + C.mono;
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      ctx.globalAlpha = 0.55 + Math.sin(game.clock / 0.32) * 0.45;
      ctx.fillText("点击屏幕开始", W / 2, H / 2 + 44);
      ctx.globalAlpha = 1;
    } else if (game.state === "paused") {
      ctx.fillStyle = "rgba(5,8,14,0.70)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 44px " + C.mono;
      ctx.fillText("已暂停", W / 2, H / 2 - 6);
      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(160,205,240,0.8)";
      ctx.fillText("按 Esc 继续", W / 2, H / 2 + 28);
    } else if (game.state === "over") {
      ctx.fillStyle = "rgba(10,4,6,0.82)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ff6b6b";
      ctx.font = "800 56px " + C.mono;
      ctx.fillText("阵　亡", W / 2, H / 2 - 70);
      ctx.fillStyle = "#eef8ff";
      ctx.font = "700 30px " + C.mono;
      ctx.fillText("得分 " + game.score, W / 2, H / 2 - 10);
      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(170,200,225,0.85)";
      ctx.fillText("距离 " + game.score + " 米 · 最高速 " + Math.round(game.peakSpeed) + " · 存活 " + game.timeAlive.toFixed(1) + " 秒", W / 2, H / 2 + 22);
      ctx.font = "600 16px " + C.mono;
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      ctx.globalAlpha = 0.55 + Math.sin(game.clock / 0.32) * 0.45;
      ctx.fillText("点击或按 R 重新开始", W / 2, H / 2 + 68);
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    var sx = 0, sy = 0;
    if (game.shake > 0.2) {
      sx = rand(-game.shake, game.shake) * 0.3;
      sy = rand(-game.shake, game.shake) * 0.3;
    }

    ctx.save();
    ctx.translate(sx, sy);
    drawBackground();

    if (game.state !== "menu") {
      drawGround();
      drawObstacles();
      if (game.state !== "over") drawPlayer();
      drawWall();
    }

    for (var j = 0; j < game.particles.length; j++) {
      var pt = game.particles[j];
      ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (game.state !== "menu" && game.hitFlash > 0) {
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
      vg.addColorStop(0, "rgba(255,0,0,0)");
      vg.addColorStop(1, "rgba(255,0,0," + (game.hitFlash * 0.45) + ")");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    var vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.85);
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    if (game.state !== "menu") drawHUD();
    drawOverlay();
  }

  // ---------- 主循环 ----------
  var last = performance.now();

  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    game.clock += dt;

    if (game.state === "playing") update(dt);
    render();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
