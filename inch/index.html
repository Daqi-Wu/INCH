<!-- INCH · LAUNCHER / v1.0 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 · INCH</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    cursor: none;
    -webkit-font-smoothing: antialiased;
  }
  a, a:hover, a:focus { cursor: none; text-decoration: none; }

  #bg { position: fixed; inset: 0; display: block; }

  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #content {
    display: flex; flex-direction: column; align-items: center;
    transform-origin: 50% 50%;
  }

  #head { text-align: center; margin-bottom: 54px; }
  .series { display: flex; align-items: baseline; justify-content: center; gap: 18px; }
  .series .cn {
    font: 800 62px/1 ui-monospace, Consolas, monospace;
    color: #eef8ff;
    letter-spacing: 0.12em;
    margin-right: -0.12em;
  }
  .series .en {
    font: 500 15px/1 ui-monospace, Consolas, monospace;
    color: rgba(160, 205, 240, 0.85);
    letter-spacing: 0.30em;
    margin-right: -0.30em;
  }
  .slogan {
    margin-top: 28px;
    font: 500 13px/1 ui-monospace, Consolas, monospace;
    color: rgba(160, 205, 240, 0.85);
    letter-spacing: 0.02em;
  }

  #grid { display: grid; gap: 18px; }

  .card {
    position: relative;
    display: block;
    width: 135px; height: 68px;
    border-radius: 10px;
    border: 1px solid;
    padding: 11px 12px;
    overflow: hidden;
  }
  .card .num {
    position: absolute; top: 9px; right: 11px;
    font: 500 11px/1 ui-monospace, Consolas, monospace;
    opacity: 0.45;
    letter-spacing: 0.04em;
  }
  .card .name {
    display: block;
    font: 600 16px/1 ui-monospace, Consolas, monospace;
    letter-spacing: 0.08em;
  }
  .card .latin {
    display: block;
    margin-top: 10px;
    font: 500 11px/1 ui-monospace, Consolas, monospace;
    letter-spacing: 0.16em;
  }

  .done { background: #633806; border-color: #EF9F27; color: #eaf6ff; }
  .done .latin { color: #EF9F27; }
  .done:hover { background-image: linear-gradient(rgba(255,255,255,0.06), rgba(255,255,255,0.06)); }
  .done:focus-visible { outline: 1px solid #7ce7ff; outline-offset: -3px; }

  .locked {
    background: #0C447C;
    border-color: #85B7EB;
    color: rgba(234, 246, 255, 0.55);
    pointer-events: none;
  }
  .locked .latin { color: #85B7EB; opacity: 0.55; }

  #foot {
    width: 100%;
    margin-top: 44px;
    display: flex;
    justify-content: space-between;
    font: 500 12px/1 ui-monospace, Consolas, monospace;
    color: rgba(180, 205, 230, 0.7);
    letter-spacing: 0.06em;
  }

  #ch {
    position: fixed; left: 0; top: 0;
    width: 40px; height: 40px;
    pointer-events: none;
    z-index: 10;
    opacity: 0;
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="stage">
  <div id="content">
    <div id="head">
      <div class="series">
        <span class="cn">方寸</span>
        <span class="en">INCH</span>
      </div>
      <div class="slogan">一屏之内，退无可退。</div>
    </div>
    <nav id="grid"></nav>
    <div id="foot">
      <span>INCH · v1.0</span>
      <span id="count">00 / 08</span>
    </div>
  </div>
</div>

<svg id="ch" viewBox="0 0 40 40" fill="none">
  <circle id="chc" cx="20" cy="20" r="9" stroke="rgba(140,235,255,0.9)" stroke-width="1.6" />
  <path d="M20 4v10M20 26v10M4 20h10M26 20h10" stroke="rgba(140,235,255,0.9)" stroke-width="1.6" />
  <rect x="18.5" y="18.5" width="3" height="3" fill="rgba(140,235,255,0.9)" />
</svg>

<script>
(function () {
  "use strict";

  // ---------- 常量与色板 ----------
  var C = {
    bg0: "#101728", bg1: "#0a0e18", bg2: "#05070c",
    grid: "rgba(90,130,190,0.075)",
    mono: 'ui-monospace, Consolas, monospace'
  };

  var CARD_W = 135, GAP = 18, COLS = 4;
  var GRID_X = 14, GRID_Y = 9;   // 与围城同频：静止的世界在呼吸

  var GAMES = [
    { cn: "围城", en: "SIEGE", file: "inch-siege.html", done: true },
    { cn: "空巷", en: "ALLEY", file: "inch-alley.html", done: true },
    { cn: "深井", en: "SHAFT", file: "inch-shaft.html", done: true },
    { cn: "断桥", en: "BREACH", file: "inch-breach.html", done: true },
    { cn: "哑火", en: "MISFIRE", file: "inch-misfire.html", done: true },
    { cn: "尾灯", en: "TAILLIGHT", file: "inch-taillight.html", done: true },
    { cn: "逆流", en: "UPSTREAM", file: "inch-upstream.html", done: true },
    { cn: "引信", en: "FUSE", file: "inch-fuse.html", done: true }
  ];

  // ---------- 工具 ----------
  function pad2(n) { return n < 10 ? "0" + n : String(n); }

  // ---------- 画布与 DPR ----------
  var canvas = document.getElementById("bg");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  var grid = document.getElementById("grid");
  var content = document.getElementById("content");
  var stage = document.getElementById("stage");
  var crosshair = document.getElementById("ch");
  var chCircle = document.getElementById("chc");
  var cols = COLS;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }

  // ---------- 卡片 ----------
  function buildCards() {
    var frag = document.createDocumentFragment();
    var done = 0;

    for (var i = 0; i < GAMES.length; i++) {
      var g = GAMES[i];
      var el;
      if (g.done) {
        el = document.createElement("a");
        el.href = g.file;
        el.className = "card done";
        done++;
      } else {
        el = document.createElement("div");
        el.className = "card locked";
        el.setAttribute("aria-disabled", "true");
      }

      var num = document.createElement("span");
      num.className = "num";
      num.textContent = pad2(i + 1);

      var name = document.createElement("span");
      name.className = "name";
      name.textContent = g.cn;

      var latin = document.createElement("span");
      latin.className = "latin";
      latin.textContent = g.en;

      el.appendChild(num);
      el.appendChild(name);
      el.appendChild(latin);
      frag.appendChild(el);
    }

    grid.appendChild(frag);
    document.getElementById("count").textContent = pad2(done) + " / " + pad2(GAMES.length);
  }

  function layout() {
    cols = (W - 48) >= COLS * CARD_W + (COLS - 1) * GAP ? COLS : 2;
    grid.style.gridTemplateColumns = "repeat(" + cols + ", " + CARD_W + "px)";
    fit();
  }

  function fit() {
    content.style.transform = "scale(1)";
    var k = Math.min(1, (H - 48) / content.offsetHeight, (W - 48) / content.offsetWidth);
    content.style.transform = "scale(" + k + ")";
  }

  // ---------- 背景 ----------
  function drawBackground(t) {
    var g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.max(W, H) * 0.78);
    g.addColorStop(0, C.bg0);
    g.addColorStop(0.55, C.bg1);
    g.addColorStop(1, C.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var step = 64;
    var ox = (t * GRID_X) % step;
    var oy = (t * GRID_Y) % step;
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = ox - step; x < W + step; x += step) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
    }
    for (var y = oy - step; y < H + step; y += step) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
    }
    ctx.stroke();

    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.85);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- 输入 ----------
  document.addEventListener("mousemove", function (e) {
    if (crosshair.style.opacity !== "1") crosshair.style.opacity = "1";
    crosshair.style.transform = "translate3d(" + (e.clientX - 20) + "px," + (e.clientY - 20) + "px,0)";
  });

  grid.addEventListener("mouseover", function (e) {
    if (e.target.closest && e.target.closest(".card.done")) chCircle.setAttribute("r", "12");
  });
  grid.addEventListener("mouseout", function (e) {
    if (e.target.closest && e.target.closest(".card.done")) chCircle.setAttribute("r", "9");
  });

  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
    if (e.code.indexOf("Arrow") !== 0) return;

    var items = Array.prototype.slice.call(document.querySelectorAll(".card.done"));
    if (!items.length) return;
    var idx = items.indexOf(document.activeElement);
    var d = 0;
    if (e.code === "ArrowLeft") d = -1;
    else if (e.code === "ArrowRight") d = 1;
    else if (e.code === "ArrowUp") d = -cols;
    else if (e.code === "ArrowDown") d = cols;

    if (idx < 0) { items[0].focus(); return; }
    items[Math.min(items.length - 1, Math.max(0, idx + d))].focus();
  });

  window.addEventListener("resize", resize);
  window.addEventListener("blur", function () { chCircle.setAttribute("r", "9"); });

  // ---------- 主循环 ----------
  buildCards();
  resize();

  var start = performance.now();

  function loop(now) {
    drawBackground((now - start) / 1000);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
