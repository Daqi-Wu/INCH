<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸-围城</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  "use strict";

  // ---------- 色板 ----------
  var C = {
    bg0: "#101728", bg1: "#0a0e18", bg2: "#05070c",
    grid: "rgba(90,130,190,0.075)",
    player: "#7ce7ff",
    gain: "#5df2a0",
    text: "#eaf6ff",
    text2: "rgba(180,205,230,0.7)",
    panel: "rgba(255,255,255,0.09)",
    line: "rgba(255,255,255,0.18)",
    wall: "rgba(2,6,12,0.55)",
    wallEdge: "rgba(140,235,255,0.25)",
    mono: 'ui-monospace, Consolas, monospace'
  };

  // ---------- 画布 ----------
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (game.state === "menu") { menuLayout(); return; }
    if (game.state === "paused") { layoutArena(); pauseLayout(); return; }
    layoutArena();
  }
  window.addEventListener("resize", resize);

  // ---------- 工具 ----------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function pad2(n) { return n < 10 ? "0" + n : String(n); }

  // ---------- 数据 ----------
  var TYPES = {
    chaser: { r: 15, hp: 30, speed: 100, dmg: 12, score: 10, color: "#ff5b5b", glow: "#ff9b9b" },
    fast:   { r: 10, hp: 16, speed: 190, dmg: 8,  score: 15, color: "#ffd166", glow: "#fff0b8" },
    tank:   { r: 26, hp: 130, speed: 58, dmg: 22, score: 30, color: "#a06bff", glow: "#d6c2ff" }
  };

  // 两件激光装备：DPS 几乎相同，形状不同
  var WEAPONS = [
    { id: "pistol", cn: "激光手枪", en: "LASER PISTOL",
      dmg: 32, cd: 0.15, spread: 0.020, speed: 1100, r: 3.2, kick: 1.6 },
    { id: "rifle", cn: "激光突击步枪", en: "LASER RIFLE",
      dmg: 15, cd: 0.070, spread: 0.065, speed: 1300, r: 2.8, kick: 1.1 }
  ];

  var MODES = [
    { id: "classic", cn: "经典围城", en: "SIEGE" },
    { id: "solo", cn: "单人围城", en: "SAFEHOUSE" }
  ];

  var SAFE_SCALE = 1.5;   // 安全屋地图 = 1.5 屏，视野占 2/3
  var HOME_AIM = 2.50;    // 首页主角的端枪角度：固定指向左下，不跟鼠标转

  var game = {
    state: "menu",
    screen: "home",          // 初始界面的三页：home / equip / mode
    mode: "classic",
    weapon: 0,
    hoverId: null,
    pressId: null,
    pageT: 1,
    ui: [],
    player: null,
    bullets: [],
    enemies: [],
    particles: [],
    pickups: [],
    walls: [],
    gates: [],
    spawns: [],
    mapW: 0, mapH: 0,
    cam: { x: 0, y: 0 },
    score: 0,
    wave: 0,
    level: 1,
    spawnQueue: [],
    spawnTimer: 0,
    banner: "",
    bannerTime: 0,
    shake: 0,
    hitFlash: 0,
    kills: 0,
    timeAlive: 0
  };

  var keys = Object.create(null);
  var mouse = { x: -99, y: -99, down: false };

  function makePlayer() {
    return {
      x: 0, y: 0, r: 14, speed: 265,
      hp: 100, maxHp: 100,
      aim: 0, fireCd: 0, invuln: 0,
      dashCd: 0, dashTime: 0, dashDirX: 0, dashDirY: 0,
      muzzle: 0, recoil: 0,
      combat: 0                 // 刚开过火的余温：>0 时嘴抿起来
    };
  }

  // ---------- 初始界面：三页 ----------
  // home：标题 + 持枪主角 + 左下「装备选择」+ 右下「模式选择」
  // equip：两件装备与全部数值
  // mode：两张模式卡 + 开始游戏 + 底部操作提示
  // 每页布局都写进 game.ui，鼠标只按 id 派发，不再维护焦点下标
  var EQ_W = 330, EQ_H = 344;
  var MD_W = 320, MD_H = 146;
  var BTN_START_H = 64, BTN_START_GAP = 48;

  function menuLayout() {
    var list = [];
    if (game.screen === "equip") layoutEquip(list);
    else if (game.screen === "mode") layoutMode(list);
    else layoutHome(list);
    game.ui = list;
  }

  function layoutHome(list) {
    var bw = 224, bh = 84, pad = 48;
    list.push({ id: "toEquip", kind: "nav", target: "equip", x: pad, y: H - pad - bh, w: bw, h: bh });
    list.push({ id: "toMode", kind: "nav", target: "mode", x: W - pad - bw, y: H - pad - bh, w: bw, h: bh });
  }

  function layoutEquip(list) {
    var gap = 24;
    var x0 = W / 2 - (EQ_W * 2 + gap) / 2;
    var y0 = clamp(H * 0.52 - EQ_H / 2, 178, Math.max(178, H - EQ_H - 80));
    list.push({ id: "backHome", kind: "nav", target: "home", x: W - 48 - 104, y: 40, w: 104, h: 42 });
    list.push({ id: "weapon0", kind: "weapon", idx: 0, x: x0, y: y0, w: EQ_W, h: EQ_H });
    list.push({ id: "weapon1", kind: "weapon", idx: 1, x: x0 + EQ_W + gap, y: y0, w: EQ_W, h: EQ_H });
  }

  function layoutMode(list) {
    var gap = 28;
    var x0 = W / 2 - (MD_W * 2 + gap) / 2;
    // 卡片 + 间距 + 按钮作为一个整体居中，而不是只居中卡片
    var blockH = MD_H + BTN_START_GAP + BTN_START_H;
    var y0 = H * 0.5 - blockH / 2 - 12;
    list.push({ id: "backHome", kind: "nav", target: "home", x: W - 48 - 104, y: 40, w: 104, h: 42 });
    list.push({ id: "mode0", kind: "mode", idx: 0, x: x0, y: y0, w: MD_W, h: MD_H });
    list.push({ id: "mode1", kind: "mode", idx: 1, x: x0 + MD_W + gap, y: y0, w: MD_W, h: MD_H });
    list.push({ id: "start", kind: "start", x: W / 2 - 160, y: y0 + MD_H + BTN_START_GAP, w: 320, h: BTN_START_H });
  }

  // 暂停时只留一个出口：继续按 Esc，退出点这里
  function pauseLayout() {
    game.ui = [{ id: "exitRun", kind: "exitRun", x: W / 2 - 92, y: H / 2 + 30, w: 184, h: 46 }];
  }

  function uiById(id) {
    for (var i = 0; i < game.ui.length; i++) if (game.ui[i].id === id) return game.ui[i];
    return null;
  }

  function hitUi(x, y) {
    for (var i = 0; i < game.ui.length; i++) {
      var u = game.ui[i];
      if (x >= u.x && x <= u.x + u.w && y >= u.y && y <= u.y + u.h) return u;
    }
    return null;
  }

  function act(u) {
    if (!u) return;
    if (u.kind === "nav") {
      game.screen = u.target;
      game.hoverId = null;
      game.pageT = 0;
      menuLayout();
    } else if (u.kind === "weapon") {
      game.weapon = u.idx;
    } else if (u.kind === "mode") {
      game.mode = MODES[u.idx].id;
    } else if (u.kind === "start") {
      startRun();
    } else if (u.kind === "exitRun") {
      backToMenu();
    }
  }

  // 眼球朝鼠标：返回 -1..1 的方向分量；鼠标还没进画面时朝右前，别斜在角上
  // 60px 内按比例收，是为了"鼠标贴着球"时瞳孔不抖；超过 60px 就顶满——
  // 对局里瞄近处的敌人时，眼珠必须立刻转过去，不能还慢半拍
  function lookAt(cx, cy, sx, sy) {
    if (mouse.x < 0 || mouse.y < 0) return { x: 0.34, y: 0.10 };
    var dx = sx - cx, dy = sy - cy;
    var d = Math.hypot(dx, dy) || 1;
    var k = Math.min(1, d / 60);
    return { x: (dx / d) * k, y: (dy / d) * k };
  }

  // ---------- 安全屋 ----------
  function rect(x, y, w, h) { return { x: x, y: y, w: w, h: h }; }

  function buildSafehouse() {
    var mw = W * SAFE_SCALE, mh = H * SAFE_SCALE;
    var T = 16, open = 96;
    var walls = [];
    var gates = [];
    var spawns = [];

    // 三个入口：上、左、右，开口居中
    var midX = mw / 2, midY = mh / 2;

    // 上墙（留口）
    walls.push(rect(0, 0, midX - open / 2, T));
    walls.push(rect(midX + open / 2, 0, mw - midX - open / 2, T));
    // 下墙整条
    walls.push(rect(0, mh - T, mw, T));
    // 左墙（留口）
    walls.push(rect(0, 0, T, midY - open / 2));
    walls.push(rect(0, midY + open / 2, T, mh - midY - open / 2));
    // 右墙（留口）
    walls.push(rect(mw - T, 0, T, midY - open / 2));
    walls.push(rect(mw - T, midY + open / 2, T, mh - midY - open / 2));

    // 三道屏风：挡在入口正前方，逼所有人绕一端
    var sw = mw * 0.26, sh = mh * 0.26;
    walls.push(rect(midX - sw / 2, mh * 0.18, sw, T));      // 入口 1（上）
    walls.push(rect(mw * 0.16, midY - sh / 2, T, sh));      // 入口 2（左）
    walls.push(rect(mw * 0.84 - T, midY - sh / 2, T, sh));  // 入口 3（右）

    // 中岛与两块低掩体
    walls.push(rect(mw * 0.42, mh * 0.42, mw * 0.16, mh * 0.14));
    walls.push(rect(mw * 0.22, mh * 0.74, mw * 0.12, mh * 0.06));
    walls.push(rect(mw * 0.66, mh * 0.74, mw * 0.12, mh * 0.06));

    // 出现点：三个开口内侧 40px
    spawns.push({ x: midX, y: T + 40, ix: 0, iy: 1 });
    spawns.push({ x: T + 40, y: midY, ix: 1, iy: 0 });
    spawns.push({ x: mw - T - 40, y: midY, ix: -1, iy: 0 });

    // 未开放的入口用闸门堵住
    gates.push(rect(midX - open / 2, 0, open, T));
    gates.push(rect(0, midY - open / 2, T, open));
    gates.push(rect(mw - T, midY - open / 2, T, open));

    return { walls: walls, gates: gates, spawns: spawns, mw: mw, mh: mh, midX: midX, midY: midY };
  }

  function layoutArena() {
    var p = game.player;
    if (!p) return;

    if (game.mode === "classic") {
      game.mapW = W;
      game.mapH = H;
      game.walls = [];
      game.gates = [];
      game.spawns = [];
      p.x = clamp(p.x, p.r, W - p.r);
      p.y = clamp(p.y, p.r, H - p.r);
      return;
    }

    var a = buildSafehouse();
    game.mapW = a.mw;
    game.mapH = a.mh;
    game.gates = a.gates;
    game.spawns = a.spawns;
    refreshWalls(a.walls);
    p.x = clamp(p.x, p.r, game.mapW - p.r);
    p.y = clamp(p.y, p.r, game.mapH - p.r);
    pushOutOfWalls(p);
  }

  function refreshWalls(base) {
    var active = game.level <= 2 ? 1 : (game.level <= 4 ? 2 : 3);
    var list = base ? base.slice() : [];
    if (!base) {
      var a = buildSafehouse();
      list = a.walls.slice();
      game.gates = a.gates;
    }
    for (var i = 0; i < game.gates.length; i++) {
      if (i >= active) list.push(game.gates[i]);
    }
    game.walls = list;
    buildNav();
  }

  // ---------- 寻路：以玩家为源点的距离场 ----------
  // 局部贴墙逻辑会在墙角打转（对称的墙没有「更近的一端」），所以直接用 BFS 流场：
  // 每格存到玩家的步数，敌人只要走向步数更小的邻格，天然不会死循环。
  var NAV = null;

  function buildNav() {
    var c = 48;
    var cols = Math.ceil(game.mapW / c), rows = Math.ceil(game.mapH / c);
    var n = cols * rows;
    var blocked = new Uint8Array(n);
    var pad = 16;                      // 敌人半径留边，别贴脸走
    for (var r = 0; r < rows; r++) {
      for (var q = 0; q < cols; q++) {
        var x0 = q * c, y0 = r * c, hit = 0;
        for (var i = 0; i < game.walls.length; i++) {
          var w = game.walls[i];
          if (x0 < w.x + w.w + pad && x0 + c > w.x - pad &&
              y0 < w.y + w.h + pad && y0 + c > w.y - pad) { hit = 1; break; }
        }
        blocked[r * cols + q] = hit;
      }
    }
    NAV = {
      c: c, cols: cols, rows: rows, blocked: blocked,
      dist: new Int32Array(n), queue: new Int32Array(n), key: -1
    };
  }

  function updateField() {
    if (!NAV) return;
    var p = game.player;
    var cols = NAV.cols, rows = NAV.rows;
    var pc = clamp(Math.floor(p.x / NAV.c), 0, cols - 1);
    var pr = clamp(Math.floor(p.y / NAV.c), 0, rows - 1);
    var start = pr * cols + pc;
    if (NAV.key === start) return;
    NAV.key = start;

    var dist = NAV.dist, q = NAV.queue;
    dist.fill(-1);
    var qh = 0, qt = 0;
    dist[start] = 0;
    q[qt++] = start;
    while (qh < qt) {
      var cur = q[qh++];
      var cr = (cur / cols) | 0, cc = cur - cr * cols;
      var nd = dist[cur] + 1;
      for (var k = 0; k < 4; k++) {
        var nr = cr + (k === 0 ? -1 : k === 1 ? 1 : 0);
        var nc = cc + (k === 2 ? -1 : k === 3 ? 1 : 0);
        if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;
        var ni = nr * cols + nc;
        if (NAV.blocked[ni] || dist[ni] >= 0) continue;
        dist[ni] = nd;
        q[qt++] = ni;
      }
    }
  }

  // 返回下一个该去的格子中心；返回 null 表示「直接冲玩家」
  function navTarget(e) {
    if (!NAV || game.mode !== "solo") return null;
    var c = NAV.c, cols = NAV.cols, rows = NAV.rows;
    var cc = clamp(Math.floor(e.x / c), 0, cols - 1);
    var cr = clamp(Math.floor(e.y / c), 0, rows - 1);
    var best = NAV.dist[cr * cols + cc];
    if (best < 0) return null;
    var br = -1, bc = -1;
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        var nr = cr + dr, nc = cc + dc;
        if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;
        var ni = nr * cols + nc;
        if (NAV.blocked[ni] || NAV.dist[ni] < 0 || NAV.dist[ni] >= best) continue;
        if (dr && dc && (NAV.blocked[cr * cols + nc] || NAV.blocked[nr * cols + cc])) continue;  // 不切角
        best = NAV.dist[ni]; br = nr; bc = nc;
      }
    }
    if (br < 0) return null;
    return { x: (bc + 0.5) * c, y: (br + 0.5) * c };
  }

  function pushOutOfWalls(o) {
    for (var i = 0; i < game.walls.length; i++) {
      var w = game.walls[i];
      if (!circleHit(o.x, o.y, o.r, w)) continue;
      var cx = clamp(o.x, w.x, w.x + w.w), cy = clamp(o.y, w.y, w.y + w.h);
      var dx = o.x - cx, dy = o.y - cy;
      var d = Math.hypot(dx, dy) || 0.01;
      o.x = cx + (dx / d) * (o.r + 0.5);
      o.y = cy + (dy / d) * (o.r + 0.5);
    }
  }

  // ---------- 碰撞 ----------
  function circleHit(x, y, r, w) {
    var nx = clamp(x, w.x, w.x + w.w);
    var ny = clamp(y, w.y, w.y + w.h);
    var dx = x - nx, dy = y - ny;
    return dx * dx + dy * dy < r * r;
  }

  function wallAt(x, y, r) {
    for (var i = 0; i < game.walls.length; i++) {
      if (circleHit(x, y, r, game.walls[i])) return game.walls[i];
    }
    return null;
  }

  // unbounded = 允许留在图外（经典模式的敌人要从屏幕外走进来）
  function moveCircle(o, dx, dy, unbounded) {
    o.blockX = false;
    o.blockY = false;
    o.wallX = null;
    o.wallY = null;
    var n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 8));
    for (var i = 0; i < n; i++) {
      var sx = dx / n;
      o.x += sx;
      var w = wallAt(o.x, o.y, o.r);
      if (w) {
        o.x = sx > 0 ? w.x - o.r - 0.01 : w.x + w.w + o.r + 0.01;
        o.blockX = true;
        o.wallX = w;
      }
      var sy = dy / n;
      o.y += sy;
      var w2 = wallAt(o.x, o.y, o.r);
      if (w2) {
        o.y = sy > 0 ? w2.y - o.r - 0.01 : w2.y + w2.h + o.r + 0.01;
        o.blockY = true;
        o.wallY = w2;
      }
    }
    if (!unbounded) {
      o.x = clamp(o.x, o.r, game.mapW - o.r);
      o.y = clamp(o.y, o.r, game.mapH - o.r);
    }
  }

  // ---------- 开局 ----------
  function startRun() {
    game.state = "playing";
    game.hoverId = null;
    game.player = makePlayer();
    game.bullets = [];
    game.enemies = [];
    game.particles = [];
    game.pickups = [];
    game.score = 0;
    game.wave = 0;
    game.level = 1;
    game.spawnQueue = [];
    game.spawnTimer = 0;
    game.banner = "";
    game.bannerTime = 0;
    game.shake = 0;
    game.hitFlash = 0;
    game.kills = 0;
    game.timeAlive = 0;

    var p = game.player;
    if (game.mode === "classic") {
      game.mapW = W;
      game.mapH = H;
      game.walls = [];
      game.gates = [];
      game.spawns = [];
      p.x = W / 2;
      p.y = H / 2;
      game.cam.x = 0;
      game.cam.y = 0;
      startClassicWave();
    } else {
      var a = buildSafehouse();
      game.mapW = a.mw;
      game.mapH = a.mh;
      game.gates = a.gates;
      game.spawns = a.spawns;
      game.level = 1;
      refreshWalls(a.walls);
      p.x = a.midX;
      p.y = a.mh * 0.68;
      game.cam.x = clamp(p.x - W / 2, 0, game.mapW - W);
      game.cam.y = clamp(p.y - H / 2, 0, game.mapH - H);
      startSoloLevel();
    }
  }

  function togglePause() {
    if (game.state === "playing") {
      game.state = "paused";
      game.hoverId = null;
      game.pressId = null;
      pauseLayout();
    } else if (game.state === "paused") {
      game.state = "playing";
      game.hoverId = null;
      game.pressId = null;
    }
  }

  function backToMenu() {
    game.state = "menu";
    game.screen = "home";
    game.hoverId = null;
    game.pressId = null;
    game.pageT = 0;
    mouse.down = false;
    menuLayout();
  }

  // ---------- 波次 / 关卡 ----------
  function pickType() {
    var roll = Math.random();
    var t = "chaser";
    var lv = game.mode === "solo" ? game.level : game.wave;
    if (lv >= 3 && roll > 0.72) t = "fast";
    if (lv >= 4 && roll > 0.9) t = "tank";
    return t;
  }

  function startClassicWave() {
    game.wave++;
    var n = 4 + Math.floor(game.wave * 2.2);
    var q = [];
    for (var i = 0; i < n; i++) q.push(pickType());
    game.spawnQueue = game.spawnQueue.concat(q);
    game.spawnTimer = game.wave === 1 ? 0.9 : 2.0;
    game.banner = "第 " + game.wave + " 波";
    game.bannerTime = 1.6;
  }

  function startSoloLevel() {
    refreshWalls(null);
    var n = 6 + game.level * 2;
    var q = [];
    for (var i = 0; i < n; i++) q.push(pickType());
    game.spawnQueue = q;
    game.spawnTimer = 1.0;
    game.banner = "第 " + pad2(game.level) + " 关";
    game.bannerTime = 1.6;
  }

  function spawnEnemy(typeName, point) {
    var t = TYPES[typeName];
    var lv = game.mode === "solo" ? game.level : game.wave;
    var scale = 1 + (lv - 1) * 0.17;
    var e = {
      type: typeName,
      r: t.r,
      hp: t.hp * scale,
      maxHp: t.hp * scale,
      speed: t.speed * (1 + (lv - 1) * 0.02),
      dmg: t.dmg,
      score: t.score,
      color: t.color,
      glow: t.glow,
      hitCd: 0,
      hurt: 0,
      vx: 0, vy: 0,
      wobble: rand(0, Math.PI * 2),
      emerge: 0,
      blockX: false, blockY: false,
      wallX: null, wallY: null
    };

    if (game.mode === "classic") {
      var edge = Math.floor(Math.random() * 4);
      var pad = 60;
      if (edge === 0) { e.x = rand(0, game.mapW); e.y = -pad; }
      else if (edge === 1) { e.x = game.mapW + pad; e.y = rand(0, game.mapH); }
      else if (edge === 2) { e.x = rand(0, game.mapW); e.y = game.mapH + pad; }
      else { e.x = -pad; e.y = rand(0, game.mapH); }
    } else {
      e.emerge = 0.45;
      e.x = point.x + rand(-26, 26);
      e.y = point.y + rand(-26, 26);
      pushOutOfWalls(e);
    }
    game.enemies.push(e);
  }

  // ---------- 特效 ----------
  function burst(x, y, color, count, power) {
    for (var i = 0; i < count; i++) {
      var a = rand(0, Math.PI * 2);
      var sp = rand(0.2, 1) * power;
      var life = rand(0.25, 0.7);
      game.particles.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: life, maxLife: life, size: rand(1.5, 3.6), color: color
      });
    }
  }

  function trail(x, y, color) {
    game.particles.push({
      x: x, y: y, vx: rand(-20, 20), vy: rand(-20, 20),
      life: 0.22, maxLife: 0.22, size: rand(1, 2.2), color: color
    });
  }

  // ---------- 射击 ----------
  function shoot(p) {
    var w = WEAPONS[game.weapon];
    var ang = p.aim + rand(-w.spread, w.spread);
    var mx = p.x + Math.cos(p.aim) * (p.r + 6);
    var my = p.y + Math.sin(p.aim) * (p.r + 6);
    game.bullets.push({
      x: mx, y: my,
      vx: Math.cos(ang) * w.speed,
      vy: Math.sin(ang) * w.speed,
      r: w.r, life: 0.85, dmg: w.dmg
    });
    p.muzzle = 0.07;
    p.recoil = w.kick * 2.2;
    p.combat = 0.14;
    game.shake = Math.min(game.shake + w.kick, 9);
    burst(mx, my, "#fff6cf", 3, 90);
  }

  // 命中敌人：白闪 + 击退 + 火花 + 微震
  function hurtEnemy(idx, b) {
    var e = game.enemies[idx];
    if (!e) return;
    e.hp -= b.dmg;
    e.hurt = 0.12;
    e.vx += b.vx * 0.012;
    e.vy += b.vy * 0.012;
    burst(b.x, b.y, e.glow, 5, 150);
    game.shake = Math.min(game.shake + 1.6, 9);
    if (e.hp > 0) return;

    burst(e.x, e.y, e.color, 22, 300);
    burst(e.x, e.y, "#ffffff", 6, 180);
    game.score += e.score;
    game.kills++;
    game.shake = Math.min(game.shake + 4, 14);
    if (Math.random() < 0.13) {
      game.pickups.push({ x: e.x, y: e.y, r: 11, life: 13, phase: rand(0, 6.28) });
    }
    game.enemies.splice(idx, 1);
    // 清场之后才开始计时：波间 2.0s / 关间 1.2s
    if (game.enemies.length === 0 && game.spawnQueue.length === 0) {
      game.spawnTimer = game.mode === "classic" ? 2.0 : 1.2;
    }
  }

  // ---------- 更新 ----------
  function update(dt) {
    var p = game.player;
    game.timeAlive += dt;
    game.shake = Math.max(0, game.shake - dt * 26);
    game.hitFlash = Math.max(0, game.hitFlash - dt);
    game.bannerTime = Math.max(0, game.bannerTime - dt);

    // 瞄准：鼠标是屏幕坐标，换成世界坐标
    var wmx = mouse.x + game.cam.x, wmy = mouse.y + game.cam.y;
    p.aim = Math.atan2(wmy - p.y, wmx - p.x);

    var mx = (keys["KeyD"] || keys["ArrowRight"] ? 1 : 0) - (keys["KeyA"] || keys["ArrowLeft"] ? 1 : 0);
    var my = (keys["KeyS"] || keys["ArrowDown"] ? 1 : 0) - (keys["KeyW"] || keys["ArrowUp"] ? 1 : 0);
    var len = Math.hypot(mx, my);
    if (len > 0) { mx /= len; my /= len; }

    p.dashCd = Math.max(0, p.dashCd - dt);
    if ((keys["ShiftLeft"] || keys["ShiftRight"]) && p.dashCd <= 0 && p.dashTime <= 0 && len > 0) {
      p.dashTime = 0.15;
      p.dashCd = 1.25;
      p.dashDirX = mx; p.dashDirY = my;
      burst(p.x, p.y, C.player, 12, 160);
    }

    var vx, vy;
    if (p.dashTime > 0) {
      p.dashTime -= dt;
      vx = p.dashDirX * 900;
      vy = p.dashDirY * 900;
      trail(p.x, p.y, C.player);
    } else {
      vx = mx * p.speed;
      vy = my * p.speed;
    }
    moveCircle(p, vx * dt, vy * dt);

    p.invuln = Math.max(0, p.invuln - dt);
    p.muzzle = Math.max(0, p.muzzle - dt);
    p.recoil = Math.max(0, p.recoil - dt * 22);
    p.combat = Math.max(0, p.combat - dt);

    // 开火
    p.fireCd -= dt;
    if (mouse.down && p.fireCd <= 0 && game.state === "playing") {
      shoot(p);
      p.fireCd = WEAPONS[game.weapon].cd;
    }

    // 相机：冲刺时故意追不上，冲完再把人送回中心
    var tx = clamp(p.x - W / 2, 0, Math.max(0, game.mapW - W));
    var ty = clamp(p.y - H / 2, 0, Math.max(0, game.mapH - H));
    var remain = p.dashTime > 0 ? 0.12 : 0.0000001;
    var k = Math.pow(remain, dt);
    game.cam.x += (tx - game.cam.x) * (1 - k);
    game.cam.y += (ty - game.cam.y) * (1 - k);
    game.cam.x = clamp(game.cam.x, 0, Math.max(0, game.mapW - W));
    game.cam.y = clamp(game.cam.y, 0, Math.max(0, game.mapH - H));

    // 子弹：分 3 个子步推进，每个子步都查墙和敌人（贴脸和高速都不会漏判）
    for (var i = game.bullets.length - 1; i >= 0; i--) {
      var b = game.bullets[i];
      var steps = 3;
      var done = false;
      for (var s = 0; s < steps && !done; s++) {
        b.x += b.vx * dt / steps;
        b.y += b.vy * dt / steps;
        if (game.walls.length && wallAt(b.x, b.y, b.r)) {
          burst(b.x, b.y, "rgba(190,235,255,0.9)", 3, 110);
          done = true;
          break;
        }
        for (var m = game.enemies.length - 1; m >= 0; m--) {
          var e2 = game.enemies[m];
          var hrr = e2.r + b.r;
          if (dist2(b.x, b.y, e2.x, e2.y) < hrr * hrr) {
            hurtEnemy(m, b);
            done = true;
            break;
          }
        }
      }
      b.life -= dt;
      if (done) { game.bullets.splice(i, 1); continue; }
      if (b.life <= 0 || b.x < -40 || b.x > game.mapW + 40 || b.y < -40 || b.y > game.mapH + 40) {
        game.bullets.splice(i, 1);
      }
    }

    // 敌人
    var px = p.x, py = p.y;
    if (game.mode === "solo") updateField();

    for (var j = game.enemies.length - 1; j >= 0; j--) {
      var e = game.enemies[j];
      e.hurt = Math.max(0, e.hurt - dt);
      e.hitCd = Math.max(0, e.hitCd - dt);
      e.wobble += dt * 6;
      if (e.emerge > 0) e.emerge = Math.max(0, e.emerge - dt);

      var nt = navTarget(e);
      var gx2 = nt ? nt.x : px, gy2 = nt ? nt.y : py;
      var dx = gx2 - e.x, dy = gy2 - e.y;
      var d = Math.hypot(dx, dy) || 1;
      var nx = dx / d, ny = dy / d;

      var sepX = 0, sepY = 0;
      for (var k2 = 0; k2 < game.enemies.length; k2++) {
        if (k2 === j) continue;
        var o = game.enemies[k2];
        var ddx = e.x - o.x, ddy = e.y - o.y;
        var dd = Math.hypot(ddx, ddy);
        if (dd > 0 && dd < e.r + o.r) {
          sepX += (ddx / dd) * (e.r + o.r - dd) * 2.2;
          sepY += (ddy / dd) * (e.r + o.r - dd) * 2.2;
        }
      }

      var wob = Math.sin(e.wobble) * 0.28;
      var mvx = nx * e.speed + sepX + (-ny) * wob * e.speed * 0.5 + e.vx;
      var mvy = ny * e.speed + sepY + (nx) * wob * e.speed * 0.5 + e.vy;

      if (e.emerge > 0) { mvx *= 0.35; mvy *= 0.35; }

      moveCircle(e, mvx * dt, mvy * dt, game.mode !== "solo");

      e.vx *= Math.pow(0.0025, dt);
      e.vy *= Math.pow(0.0025, dt);

      // 接触伤害
      var rr = e.r + p.r;
      var pdd = dist2(e.x, e.y, px, py);
      if (e.emerge <= 0 && pdd < rr * rr) {
        // 先把重叠推开，别让敌人嵌进玩家身体里
        var pd = Math.sqrt(pdd) || 1;
        moveCircle(e, (e.x - px) / pd * (rr - pd), (e.y - py) / pd * (rr - pd), game.mode !== "solo");
        if (e.hitCd <= 0 && p.invuln <= 0 && p.dashTime <= 0) {
          p.hp -= e.dmg;
          p.invuln = 0.55;
          e.hitCd = 0.7;
          game.shake = Math.min(game.shake + 8, 16);
          game.hitFlash = 0.6;
          e.vx = -nx * 320;
          e.vy = -ny * 320;
          moveCircle(p, -nx * 14, -ny * 14);
          burst(px, py, "#ff5b5b", 14, 220);
          if (p.hp <= 0) { die(); return; }
        }
      }
    }

    // 补给
    for (var q = game.pickups.length - 1; q >= 0; q--) {
      var pk = game.pickups[q];
      pk.life -= dt;
      pk.phase += dt * 4;
      if (pk.life <= 0) { game.pickups.splice(q, 1); continue; }
      var pr = pk.r + p.r;
      if (dist2(pk.x, pk.y, p.x, p.y) < pr * pr) {
        p.hp = Math.min(p.maxHp, p.hp + 28);
        burst(pk.x, pk.y, C.gain, 16, 200);
        game.pickups.splice(q, 1);
      }
    }

    // 粒子
    for (var n2 = game.particles.length - 1; n2 >= 0; n2--) {
      var pt = game.particles[n2];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= Math.pow(0.02, dt);
      pt.vy *= Math.pow(0.02, dt);
      pt.life -= dt;
      if (pt.life <= 0) game.particles.splice(n2, 1);
    }

    schedule(dt);
  }

  function schedule(dt) {
    game.spawnTimer -= dt;

    if (game.spawnQueue.length > 0) {
      if (game.spawnTimer <= 0 && game.enemies.length < 46) {
        var cnt = Math.min(game.spawnQueue.length, 1 + Math.floor(Math.random() * 3));
        for (var s = 0; s < cnt; s++) {
          if (game.mode === "classic") {
            spawnEnemy(game.spawnQueue.shift());
          } else {
            var active = game.spawns.slice(0, game.level <= 2 ? 1 : (game.level <= 4 ? 2 : 3));
            spawnEnemy(game.spawnQueue.shift(), active[Math.floor(Math.random() * active.length)]);
          }
        }
        game.spawnTimer = game.mode === "solo" ? 1.6 : rand(0.28, 0.6);
      }
      return;
    }

    if (game.enemies.length > 0) return;

    if (game.spawnTimer > 0) return;
    if (game.mode === "classic") {
      startClassicWave();
    } else {
      game.level++;
      startSoloLevel();
    }
  }

  function die() {
    game.state = "over";
    burst(game.player.x, game.player.y, "#ff5b5b", 60, 420);
    burst(game.player.x, game.player.y, "#ffffff", 20, 260);
    game.shake = 22;
  }

  // ---------- 绘制 ----------
  function drawBackground(t) {
    var g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.max(W, H) * 0.78);
    g.addColorStop(0, C.bg0);
    g.addColorStop(0.55, C.bg1);
    g.addColorStop(1, C.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var step = 64;
    var ox = ((t * 14 - game.cam.x) % step + step) % step - step;
    var oy = ((t * 9 - game.cam.y) % step + step) % step - step;
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = ox; x < W + step; x += step) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
    }
    for (var y = oy; y < H + step; y += step) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
    }
    ctx.stroke();
  }

  function drawWalls() {
    for (var i = 0; i < game.walls.length; i++) {
      var w = game.walls[i];
      ctx.fillStyle = C.wall;
      ctx.fillRect(w.x, w.y, w.w, w.h);
      // 下缘一道暗边，读起来像有厚度的板；上缘一道亮边，跟实体光源一致
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fillRect(w.x, w.y + w.h - 4, w.w, 4);
      ctx.fillStyle = C.wallEdge;
      if (w.w >= w.h) ctx.fillRect(w.x, w.y, w.w, 2);
      else ctx.fillRect(w.x, w.y, 2, w.h);
    }
  }

  function drawThresholds() {
    if (game.mode !== "solo") return;
    var active = game.level <= 2 ? 1 : (game.level <= 4 ? 2 : 3);
    for (var i = 0; i < active; i++) {
      var s = game.spawns[i];
      var a = 0.12 + Math.sin(game.timeAlive * 2.4 + i) * 0.08;
      ctx.fillStyle = "rgba(255,91,91," + a + ")";
      if (s.ix === 0) ctx.fillRect(s.x - 48, s.iy > 0 ? 16 : game.mapH - 28, 96, 12);
      else ctx.fillRect(s.ix > 0 ? 16 : game.mapW - 28, s.y - 48, 12, 96);
    }
  }

  // 一把圆头圆脑的激光手枪：机身 + 枪管 + 枪口 + 斜握把（+ 步枪的枪托）
  // 全部用 roundRect 画进同一条路径，先粗描深色再填亮色 —— 外描边是一整块，
  // 内部接缝被填色盖掉，所以读起来是一把枪，不是几块拼起来的白条
  // 所有尺寸都乘 r×sc：换个尺寸画，胖瘦比例不变
  function gunPath(r, id, sc, x0) {
    var isR = id === "rifle";
    var k = r * sc;
    var len = (isR ? 1.45 : 0.95) * k;
    var H = (isR ? 0.30 : 0.34) * k;       // 机身厚
    var bw = H * 0.46;                     // 枪管细一半
    var bodyEnd = x0 + len * (isR ? 0.56 : 0.58);
    var tipW = len * 0.08;
    var barEnd = x0 + len - tipW;
    var gw = H * 0.42, gh = H * 0.92;
    var gx = x0 + len * (isR ? 0.14 : 0.20);

    ctx.beginPath();
    ctx.roundRect(x0, -H / 2, bodyEnd - x0, H, H * 0.36);                       // 机身
    ctx.roundRect(bodyEnd - 3, -bw / 2, barEnd - bodyEnd + 3, bw, bw * 0.48);   // 枪管
    if (isR) ctx.roundRect(x0 - H * 0.95, -H * 0.30, H * 1.10, H * 0.60, H * 0.24);
    ctx.save();
    ctx.translate(gx, H * 0.22);
    ctx.rotate(0.42);
    ctx.roundRect(-gw / 2, 0, gw, gh, gw * 0.42);                                // 握把
    ctx.restore();
    return {
      len: len, H: H, bw: bw, bodyEnd: bodyEnd, barEnd: barEnd,
      tipW: tipW, gx: gx, gw: gw, gh: gh
    };
  }

  // 枪在局部坐标里占的横向范围，给"居中预览"用
  function gunSpan(r, id, sc) {
    var isR = id === "rifle";
    var k = r * sc;
    var x0 = r - 3;
    var len = (isR ? 1.45 : 0.95) * k;
    var H = (isR ? 0.30 : 0.34) * k;
    return { min: x0 - (isR ? H * 0.95 : 0), max: x0 + len };
  }

  // 握把单独上一档更暗的色，形状才不是一个整块白
  function gripPath(g) {
    ctx.beginPath();
    ctx.save();
    ctx.translate(g.gx, g.H * 0.22);
    ctx.rotate(0.42);
    ctx.roundRect(-g.gw / 2, 0, g.gw, g.gh, g.gw * 0.42);
    ctx.restore();
  }

  function drawGun(r, id, recoil, muzzle, sc, x0) {
    sc = sc || 1;
    if (x0 === undefined) x0 = r - 3 - recoil;
    var g = gunPath(r, id, sc, x0);
    var lw = Math.max(1.5, g.H * 0.12);

    // 一次描粗边、一次填亮色：整把枪共用一条外轮廓，内部接缝被填色盖掉
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(6,14,24,0.92)";
    ctx.lineWidth = lw * 2;
    ctx.stroke();
    ctx.fillStyle = "rgba(212,236,255,1)";
    ctx.fill();

    gripPath(g);
    ctx.fillStyle = "rgba(138,180,214,1)";
    ctx.fill();

    // 能量槽：机身中段一条青色光条
    ctx.beginPath();
    ctx.roundRect(x0 + g.len * 0.14, -g.H * 0.13, g.len * 0.30, g.H * 0.26, g.H * 0.13);
    ctx.fillStyle = "rgba(124,231,255,0.92)";
    ctx.fill();

    // 亮口：藏在枪管末端里的一颗发光点，不外凸
    var ex = g.barEnd - g.bw * 0.55;
    ctx.beginPath();
    ctx.arc(ex, 0, g.bw * 0.44, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(124,231,255,0.55)";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ex, 0, g.bw * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fill();

    if (muzzle > 0) {
      ctx.beginPath();
      ctx.arc(x0 + g.len, 0, 7 + muzzle * 60, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(200,245,255,0.85)";
      ctx.fill();
    }
  }

  // 一张脸：一对竖椭圆黑眼（里面一颗居中白眼球）+ 一张只上下弯的嘴
  // 参考图里黑色是整颗眼，白是嵌在正中的眼球；颜色一个没换，换的是谁包着谁
  var FACE = {
    ex: 0.31,    // 眼睛横向偏移（× r）
    ey: -0.145,  // 眼睛纵向偏移
    rx: 0.165,   // 眼半宽
    ry: 0.24,    // 眼半高（竖椭圆，高宽比 1.45）
    wx: 0.54,    // 白眼球半宽（相对眼半宽）—— 越小黑边越厚
    wy: 0.62,    // 白眼球半高
    mx: 0.19,    // 嘴半宽
    my: 0.395,   // 嘴的中线（笑与沮丧以这条线为轴，不是以两个嘴角为轴）
    mw: 0.044    // 嘴的线宽
  };

  // 眼：眼形本身就是裁切区——先裁竖椭圆，攻击态再交上一个半平面，
  // 把"内上角"整块切掉，留下外上那个尖角，就是在瞪人
  function drawEye(x, y, rx, ry, lx, ly, alpha, inner, cut, tilt) {
    ctx.save();
    ctx.translate(x, y);
    if (tilt) ctx.rotate(tilt);

    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();

    if (cut) {
      var ax = inner * -1.05 * rx, ay = -1.15 * ry;   // 外侧上方（尖角那端）
      var bx = inner * 1.10 * rx, by = 0.15 * ry;     // 内缘偏下
      var dx = bx - ax, dy = by - ay;
      var nx = -dy, ny = dx;                          // 法线
      if (ny < 0) { nx = -nx; ny = -ny; }             // 统一朝下方（保留侧）
      var m = Math.hypot(nx, ny) || 1, big = (rx + ry) * 4;
      nx = nx / m * big; ny = ny / m * big;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.lineTo(bx + nx, by + ny);
      ctx.lineTo(ax + nx, ay + ny);
      ctx.closePath();
      ctx.clip();
    }

    // 黑眼：铺满整个裁切区
    ctx.fillStyle = "rgba(8,17,30," + alpha + ")";
    ctx.fillRect(-rx * 1.4, -ry * 1.4, rx * 2.8, ry * 2.8);

    // 白眼球：居中，只随视线轻轻偏，绝对不出黑边
    var wrx = rx * FACE.wx, wry = ry * FACE.wy;
    ctx.beginPath();
    ctx.ellipse(
      clamp(lx, -1, 1) * (rx - wrx) * 0.30,
      clamp(ly, -1, 1) * (ry - wry) * 0.30,
      wrx, wry, 0, 0, Math.PI * 2
    );
    ctx.fillStyle = "rgba(238,252,255," + alpha + ")";
    ctx.fill();

    ctx.restore();
  }

  // 嘴：两端上下摆动、中间钉在中线上。
  // 以嘴角为轴时，沮丧要把中间往上顶，整条嘴就往眼睛那边挤；以中间为轴，
  // 换表情时嘴的视觉位置不动，只是两个嘴角上下翻。
  function drawMouth(r, mood, alpha) {
    var w = r * FACE.mx;
    var yMid = r * FACE.my;
    var dip = mood === "up" ? r * 0.13 : -r * 0.13;
    var yEnd = yMid - dip;

    ctx.beginPath();
    ctx.moveTo(-w, yEnd);
    ctx.quadraticCurveTo(0, yMid + dip, w, yEnd);
    ctx.lineWidth = Math.max(1.4, r * FACE.mw);
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(8,17,30," + alpha + ")";
    ctx.stroke();
  }

  function drawFace(r, eye, alpha) {
    var mood = (eye && eye.mood) || "up";
    var lx = eye ? eye.x : 0, ly = eye ? eye.y : 0;
    var down = mood === "down" || mood === "angry";
    var cut = mood === "angry";                   // 只有攻击态切眼
    var tilt = mood === "down" ? 0.17 : 0;        // 只是不好受 -> 内眼角上挑
    var k = down ? 0.90 : 1;
    var rx = r * FACE.rx, ry = r * FACE.ry * k;
    var ox = r * FACE.ex, oy = r * FACE.ey;

    drawEye(-ox, oy, rx, ry, lx, ly, alpha, 1, cut, tilt);
    drawEye(ox, oy, rx, ry, lx, ly, alpha, -1, cut, -tilt);
    drawMouth(r, down ? "down" : "up", alpha);
  }

  // front = true 时枪画在本体之上、从球的左前方伸出，读作"端着"；
  // 对局中仍用 false，枪托藏在球底下，让球的轮廓保持完整
  function drawPawn(x, y, r, aim, alpha, recoil, muzzle, weaponId, glow, gsc, eye, front) {
    ctx.save();
    ctx.translate(x, y);

    ctx.beginPath();
    ctx.arc(0, r * 0.28, r + 2, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, r + 6, 0, Math.PI * 2);
    ctx.fillStyle = glow ? "rgba(124,231,255,0.18)" : "rgba(124,231,255,0.14)";
    ctx.fill();

    // 侧视的枪只能靠镜像转身：直接转 180° 会把枪画倒（握把朝上）
    var flip = Math.cos(aim) < 0 ? -1 : 1;

    if (!front) {
      ctx.save();
      ctx.rotate(aim);
      if (flip < 0) ctx.scale(1, -1);
      drawGun(r, weaponId, recoil, muzzle, gsc);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    var pg = ctx.createRadialGradient(-r * 0.28, -r * 0.35, 2, 0, 0, r + 2);
    pg.addColorStop(0, "rgba(190,245,255," + alpha + ")");
    pg.addColorStop(1, "rgba(60,150,220," + (alpha * 0.9) + ")");
    ctx.fillStyle = pg;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(150,235,255," + (alpha * 0.9) + ")";
    ctx.stroke();

    if (front) {
      ctx.save();
      ctx.rotate(aim);
      if (flip < 0) ctx.scale(1, -1);
      ctx.translate(r * 0.72, 0);
      drawGun(r, weaponId, recoil, muzzle, gsc, 0);
      ctx.restore();
    }

    drawFace(r, eye, alpha);

    ctx.restore();
  }

  function drawPlayer(p) {
    var wmx = mouse.x + game.cam.x, wmy = mouse.y + game.cam.y;
    var look = lookAt(p.x, p.y, wmx, wmy);
    // 嘴只有上下两种；开火时额外把眼的内上角切掉，变成瞪人
    var mood = p.combat > 0 ? "angry" : (p.hp / p.maxHp <= 0.35 ? "down" : "up");
    var inv = p.invuln > 0 ? 0.35 : 1;
    drawPawn(p.x, p.y, p.r, p.aim, inv, p.recoil, p.muzzle, WEAPONS[game.weapon].id,
      false, 1, { x: look.x, y: look.y, mood: mood });

    if (p.dashCd > 0) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 8, -Math.PI / 2, -Math.PI / 2 + (1 - p.dashCd / 1.25) * Math.PI * 2);
      ctx.strokeStyle = "rgba(124,231,255,0.5)";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  }

  function drawEnemy(e) {
    var sc = e.emerge > 0 ? 1 - (e.emerge / 0.45) * 0.6 : 1;
    var al = e.emerge > 0 ? 1 - (e.emerge / 0.45) * 0.55 : 1;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(sc, sc);
    ctx.globalAlpha = al;

    ctx.beginPath();
    ctx.arc(0, 5, e.r + 2, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fill();

    var base = e.hurt > 0 ? "#ffffff" : e.color;
    ctx.beginPath();
    ctx.arc(0, 0, e.r, 0, Math.PI * 2);
    var eg = ctx.createRadialGradient(-e.r * 0.3, -e.r * 0.35, 1, 0, 0, e.r + 1);
    eg.addColorStop(0, e.glow);
    eg.addColorStop(1, base);
    ctx.fillStyle = eg;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.stroke();

    if (e.hp < e.maxHp) {
      var w = e.r * 2;
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(-w / 2, -e.r - 9, w, 4);
      ctx.fillStyle = "#ff5b5b";
      ctx.fillRect(-w / 2, -e.r - 9, w * (e.hp / e.maxHp), 4);
      if (e.r > 20) {
        ctx.strokeStyle = "rgba(0,0,0,0.6)";
        ctx.lineWidth = 1;
        ctx.strokeRect(-w / 2 - 0.5, -e.r - 9.5, w + 1, 5);
      }
    }
    ctx.restore();
  }

  // hover ∈ 0..1：停在可点元素上时准星张开，跟卡片提亮同步
  function drawCrosshair(hover) {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.strokeStyle = "rgba(140,235,255,0.9)";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, 0, 9 + 3 * (hover || 0), 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-16, 0); ctx.lineTo(-6, 0);
    ctx.moveTo(16, 0); ctx.lineTo(6, 0);
    ctx.moveTo(0, -16); ctx.lineTo(0, -6);
    ctx.moveTo(0, 16); ctx.lineTo(0, 6);
    ctx.stroke();
    ctx.fillStyle = "rgba(140,235,255,0.9)";
    ctx.fillRect(-1.5, -1.5, 3, 3);
    ctx.restore();
  }

  function drawHUD() {
    var p = game.player;
    var bw = 244, bh = 14, bx = 24, by = 24;

    ctx.fillStyle = C.panel;
    ctx.fillRect(bx, by, bw, bh);
    var hpr = clamp(p.hp / p.maxHp, 0, 1);
    var hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    if (hpr > 0.35) { hg.addColorStop(0, "#2ee6a8"); hg.addColorStop(1, "#8ff7d0"); }
    else { hg.addColorStop(0, "#ff3b3b"); hg.addColorStop(1, "#ff9b6b"); }
    ctx.fillStyle = hg;
    ctx.fillRect(bx, by, bw * hpr, bh);
    ctx.strokeStyle = C.line;
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw, bh);

    ctx.font = "600 12px " + C.mono;
    ctx.fillStyle = C.text2;
    ctx.textAlign = "left";
    ctx.fillText("HP " + Math.max(0, Math.ceil(p.hp)) + " / " + p.maxHp, bx, by + bh + 18);

    ctx.textAlign = "right";
    ctx.font = "700 26px " + C.mono;
    ctx.fillStyle = C.text;
    ctx.fillText(String(game.score).padStart(5, "0"), W - 24, 46);
    ctx.font = "500 12px " + C.mono;
    ctx.fillStyle = C.text2;
    if (game.mode === "classic") {
      ctx.fillText("WAVE " + pad2(game.wave) + "   KILLS " + game.kills, W - 24, 66);
    } else {
      ctx.fillText("LEVEL " + pad2(game.level) + "   KILLS " + game.kills +
        "   LEFT " + pad2(game.spawnQueue.length + game.enemies.length), W - 24, 66);
    }

    if (game.bannerTime > 0) {
      var a = Math.min(1, game.bannerTime / 0.4);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = "center";
      ctx.font = "800 52px " + C.mono;
      ctx.fillStyle = C.text;
      ctx.fillText(game.banner, W / 2, H * 0.24);
      ctx.font = "500 13px " + C.mono;
      ctx.fillStyle = "rgba(150,200,235,0.85)";
      ctx.fillText(game.mode === "solo" ? "SAFEHOUSE" : "ENEMIES INCOMING", W / 2, H * 0.24 + 26);
      ctx.restore();
    }
  }

  // ---------- 菜单 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  // ---------- 界面动效 ----------
  // 每个可交互元素一个 { h, p }：悬停 / 按下各自的进度，0..1
  // 用 pow(remain, dt) 逼近目标 —— 临界阻尼、不过冲，也不违反"不用缓动曲线"的约定
  var UI_ANIM = Object.create(null);
  var ANIM_K = 1e-5;          // 1 秒后只剩这么多：约 0.087s 走完 63%
  var PAGE_T = 0.14;          // 换页淡入时长（线性）

  function animOf(id) {
    var a = UI_ANIM[id];
    if (!a) a = UI_ANIM[id] = { h: 0, p: 0 };
    return a;
  }

  // 菜单与暂停时推进这些进度；对局中不跑，省掉每帧的无效计算
  function uiStep(dt) {
    var k = Math.pow(ANIM_K, dt);
    for (var i = 0; i < game.ui.length; i++) {
      var u = game.ui[i], a = animOf(u.id);
      a.h += ((game.hoverId === u.id ? 1 : 0) - a.h) * (1 - k);
      a.p += ((game.pressId === u.id ? 1 : 0) - a.p) * (1 - k);
      if (a.h < 0.001) a.h = 0;
      if (a.p < 0.001) a.p = 0;
    }
    if (game.pageT < 1) game.pageT = Math.min(1, game.pageT + dt / PAGE_T);
  }

  function hoverAmt() {
    var m = 0;
    for (var i = 0; i < game.ui.length; i++) {
      var a = animOf(game.ui[i].id);
      if (a.h > m) m = a.h;
    }
    return m;
  }

  // 按下时整块缩一点，绕自身中心缩放，文字跟着一起缩——手感才像真的按下去
  function withPress(u, fn) {
    var a = animOf(u.id);
    var sc = 1 - 0.03 * a.p;
    if (sc > 0.999) { fn(a); return; }
    ctx.save();
    ctx.translate(u.x + u.w / 2, u.y + u.h / 2);
    ctx.scale(sc, sc);
    ctx.translate(-(u.x + u.w / 2), -(u.y + u.h / 2));
    fn(a);
    ctx.restore();
  }

  // 卡片底：选中描边用主角色；悬停 / 按下按进度提亮
  // 顶部一条 1px 受光边，和墙体同源——让卡片读成"有厚度的板"，而不是一块半透明色块
  function cardBg(u, on) {
    var a = animOf(u.id);
    var f0 = on ? 0.10 : 0.09, fh = on ? 0.14 : 0.13, fp = 0.19;
    var fa = f0 + (fh - f0) * a.h;
    fa += (fp - fa) * a.p;

    roundRect(u.x, u.y, u.w, u.h, 10);
    ctx.fillStyle = on
      ? "rgba(124,231,255," + fa.toFixed(3) + ")"
      : "rgba(255,255,255," + fa.toFixed(3) + ")";
    ctx.fill();

    roundRect(u.x + 0.5, u.y + 0.5, u.w - 1, u.h - 1, 10);
    ctx.strokeStyle = on ? C.player : "rgba(255,255,255," + (0.18 + 0.17 * a.h + 0.13 * a.p).toFixed(3) + ")";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255," + (0.09 + 0.05 * a.h).toFixed(3) + ")";
    ctx.fillRect(u.x + 12, u.y + 1.5, u.w - 24, 1);
  }

  // 选中标记：装备卡与模式卡同一种点——长得一样的东西，选中的表示法也必须一样
  function drawSelDot(u, on) {
    ctx.beginPath();
    ctx.arc(u.x + u.w - 26, u.y + 26, 5, 0, Math.PI * 2);
    if (on) { ctx.fillStyle = C.player; ctx.fill(); }
    else { ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineWidth = 1.4; ctx.stroke(); }
  }

  function drawTitleBlock() {
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "#eef8ff";
    ctx.font = "800 62px " + C.mono;
    ctx.letterSpacing = "0.12em";
    ctx.fillText("方寸-围城", 48, 48);
    ctx.letterSpacing = "0.30em";
    ctx.font = "500 15px " + C.mono;
    ctx.fillStyle = "rgba(160,205,240,0.85)";
    ctx.fillText("INCH SIEGE", 50, 126);
    ctx.letterSpacing = "0.08em";
    ctx.font = "500 13px " + C.mono;
    ctx.fillStyle = "rgba(160,205,240,0.85)";
    ctx.fillText("方寸之内，退无可退。", 49, 156);
    ctx.letterSpacing = "0px";
    ctx.textBaseline = "alphabetic";
  }

  // 子页标题：与首页标题同一处落笔，只降一号
  function drawPageTitle(cn, en) {
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "#eef8ff";
    ctx.font = "800 44px " + C.mono;
    ctx.letterSpacing = "0.10em";
    ctx.fillText(cn, 48, 46);
    ctx.letterSpacing = "0.28em";
    ctx.font = "500 13px " + C.mono;
    ctx.fillStyle = "rgba(160,205,240,0.8)";
    ctx.fillText(en, 50, 100);
    ctx.letterSpacing = "0px";
    ctx.textBaseline = "alphabetic";
  }

  function drawBackBtn() {
    var u = uiById("backHome");
    if (!u) return;
    withPress(u, function (a) {
      cardBg(u, false);
      ctx.textAlign = "center";
      ctx.font = "600 13px " + C.mono;
      ctx.fillStyle = a.h > 0.02 ? C.player : "rgba(190,215,240,0.85)";
      ctx.fillText("← 返回", u.x + u.w / 2, u.y + 26);
    });
  }

  // 首页入口按钮：中文名 + 英文名 + 当前取值，右端一个尖角箭头
  function drawNavButton(u, cn, en, value) {
    withPress(u, function (a) {
      cardBg(u, false);
      ctx.textAlign = "left";
      ctx.font = "600 18px " + C.mono;
      ctx.fillStyle = C.text;
      ctx.fillText(cn, u.x + 20, u.y + 33);
      ctx.font = "500 10px " + C.mono;
      ctx.fillStyle = C.text2;
      ctx.letterSpacing = "0.18em";
      ctx.fillText(en, u.x + 21, u.y + 52);
      ctx.letterSpacing = "0px";
      ctx.font = "600 12px " + C.mono;
      ctx.fillStyle = "rgba(124,231,255," + (0.72 + 0.28 * a.h).toFixed(3) + ")";
      ctx.fillText(value, u.x + 20, u.y + 72);

      // 箭头随悬停前移 3px：手没动也能看出"这里能进去"
      var ax = u.x + u.w - 20 + 3 * a.h;
      ctx.strokeStyle = "rgba(" + Math.round(255 - 131 * a.h) + ",255,255," + (0.30 + 0.70 * a.h).toFixed(3) + ")";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(ax - 6, u.y + u.h / 2 - 5);
      ctx.lineTo(ax, u.y + u.h / 2);
      ctx.lineTo(ax - 6, u.y + u.h / 2 + 5);
      ctx.stroke();
    });
  }

  function drawHome(t) {
    drawTitleBlock();

    // 主角：正中偏上。枪固定指向左下（端枪姿势，不跟鼠标转），只有眼珠朝鼠标
    var cx = W / 2, cy = H / 2 - 28;
    var hr = clamp(Math.min(W, H) * 0.068, 36, 58);
    var look = lookAt(cx, cy, mouse.x, mouse.y);

    // 端着枪会累：两个低频正弦叠一起，身体微微起伏、枪口轻轻漂
    // 单一频率看起来像机械振动，两个互质频率才像呼吸
    var sway = Math.sin(t * 1.15) * 0.68 + Math.sin(t * 0.53 + 1.2) * 0.32;
    var bob = Math.sin(t * 1.15 + 0.6) * 0.030;

    drawPawn(cx, cy + bob * hr, hr, HOME_AIM + sway * 0.055, 1, 0, 0,
      WEAPONS[game.weapon].id, true, 1.9,
      { x: look.x, y: look.y, mood: "up" }, true);

    var a = uiById("toEquip"), b = uiById("toMode");
    if (a) drawNavButton(a, "装备选择", "EQUIPMENT", WEAPONS[game.weapon].cn);
    if (b) drawNavButton(b, "模式选择", "MODE", MODES[game.mode === "classic" ? 0 : 1].cn);
  }

  function drawEquip() {
    drawPageTitle("装备选择", "EQUIPMENT");
    drawBackBtn();
    for (var i = 0; i < WEAPONS.length; i++) {
      var u = uiById("weapon" + i);
      if (u) drawWeaponCard(u, WEAPONS[i], i);
    }
    drawFooter("点击卡片切换装备 · Esc 返回");
  }

  function drawWeaponCard(u, wp, idx) {
    var on = game.weapon === idx;
    withPress(u, function (a) {
    cardBg(u, on);

    // 枪械预览：按整把枪的包围盒居中（含枪托），与游戏里同一套图元
    var r = 42, sc = 2.35;
    var sp = gunSpan(r, wp.id, sc);
    ctx.save();
    ctx.translate(u.x + u.w / 2 - (sp.min + sp.max) / 2, u.y + 74);
    drawGun(r, wp.id, 0, 0, sc);
    ctx.restore();

    ctx.textAlign = "left";
    ctx.font = "700 20px " + C.mono;
    ctx.fillStyle = C.text;
    ctx.fillText(wp.cn, u.x + 22, u.y + 146);
    ctx.font = "500 10px " + C.mono;
    ctx.fillStyle = on ? C.player : C.text2;
    ctx.letterSpacing = "0.18em";
    ctx.fillText(wp.en, u.x + 23, u.y + 165);
    ctx.letterSpacing = "0px";

    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fillRect(u.x + 22, u.y + 180, u.w - 44, 1);

    var rows = [
      ["伤害", String(wp.dmg)],
      ["间隔", wp.cd.toFixed(2) + "s"],
      ["散布", (wp.spread * 180 / Math.PI).toFixed(1) + "°"],
      ["弹速", String(wp.speed)],
      ["每秒伤害", String(Math.round(wp.dmg / wp.cd))]
    ];
    for (var i = 0; i < rows.length; i++) {
      var ry = u.y + 206 + i * 27;
      ctx.textAlign = "left";
      ctx.font = "500 13px " + C.mono;
      ctx.fillStyle = "rgba(160,190,215,0.78)";
      ctx.fillText(rows[i][0], u.x + 22, ry);
      ctx.textAlign = "right";
      ctx.font = "600 13px " + C.mono;
      ctx.fillStyle = on ? C.player : C.text;
      ctx.fillText(rows[i][1], u.x + u.w - 22, ry);
    }
    ctx.textAlign = "left";
    drawSelDot(u, on);
    });
  }

  function drawMode() {
    drawPageTitle("模式选择", "MODE");
    drawBackBtn();
    for (var i = 0; i < MODES.length; i++) {
      var u = uiById("mode" + i);
      if (u) drawModeCard(u, MODES[i]);
    }
    var s = uiById("start");
    if (s) drawStartBtn(s);
    drawFooter("WASD 移动 · 鼠标瞄准 · 左键射击 · Shift 冲刺 · Esc 暂停");
  }

  // 页脚提示：与左右边距同一套 48px 安全线，不贴着屏幕边
  function drawFooter(text) {
    ctx.textAlign = "center";
    ctx.font = "500 12px " + C.mono;
    ctx.fillStyle = "rgba(150,190,225,0.66)";
    ctx.fillText(text, W / 2, H - 48);
  }

  function drawModeCard(u, m) {
    var on = game.mode === m.id;
    withPress(u, function () {
    cardBg(u, on);

    ctx.textAlign = "left";
    ctx.font = "700 24px " + C.mono;
    ctx.fillStyle = C.text;
    ctx.fillText(m.cn, u.x + 24, u.y + 52);
    ctx.font = "500 10px " + C.mono;
    ctx.fillStyle = on ? C.player : C.text2;
    ctx.letterSpacing = "0.20em";
    ctx.fillText(m.en, u.x + 25, u.y + 74);
    ctx.letterSpacing = "0px";
    ctx.font = "500 12px " + C.mono;
    ctx.fillStyle = "rgba(160,190,215,0.78)";
    ctx.fillText(m.id === "classic" ? "无尽波次 · 视野即全图" : "安全屋 · 三处入口 · 逐关推进", u.x + 24, u.y + 110);

    drawSelDot(u, on);
    });
  }

  function drawStartBtn(u) {
    withPress(u, function (a) {
      var lit = Math.max(a.h, a.p);
      roundRect(u.x, u.y, u.w, u.h, 10);
      ctx.fillStyle = "rgba(124,231,255," + (0.13 + 0.09 * a.h + 0.08 * a.p).toFixed(3) + ")";
      ctx.fill();
      roundRect(u.x + 0.5, u.y + 0.5, u.w - 1, u.h - 1, 10);
      ctx.strokeStyle = "rgba(124,231,255," + (0.55 + 0.40 * lit).toFixed(3) + ")";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255," + (0.12 + 0.06 * a.h).toFixed(3) + ")";
      ctx.fillRect(u.x + 14, u.y + 1.5, u.w - 28, 1);

      ctx.textAlign = "center";
      ctx.font = "700 18px " + C.mono;
      ctx.fillStyle = "#eaf6ff";
      ctx.fillText("开始游戏", u.x + u.w / 2, u.y + 31);
      ctx.font = "500 10px " + C.mono;
      ctx.letterSpacing = "0.26em";
      ctx.fillStyle = "rgba(160,220,245," + (0.85 + 0.15 * lit).toFixed(3) + ")";
      ctx.fillText("START", u.x + u.w / 2, u.y + 49);
      ctx.letterSpacing = "0px";
    });
  }

  // 换页不做位移，只做"材料到位"：透明度 + 轻微放大，方向中性，来回都不会有方向错觉
  function drawMenu(t) {
    ctx.fillStyle = "rgba(5,8,14,0.78)";
    ctx.fillRect(0, 0, W, H);

    var e = game.pageT;
    if (e < 1) {
      ctx.save();
      ctx.globalAlpha = e;
      var k = 0.982 + 0.018 * e;
      ctx.translate(W / 2, H / 2);
      ctx.scale(k, k);
      ctx.translate(-W / 2, -H / 2);
    }
    if (game.screen === "equip") drawEquip();
    else if (game.screen === "mode") drawMode();
    else drawHome(t);
    if (e < 1) ctx.restore();

    drawCrosshair(hoverAmt());
  }

  function drawOverlay() {
    if (game.state === "paused") {
      ctx.fillStyle = "rgba(5,8,14,0.70)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#eef8ff";
      ctx.font = "800 44px " + C.mono;
      ctx.fillText("已暂停", W / 2, H / 2 - 44);
      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(160,205,240,0.8)";
      ctx.fillText("按 Esc 继续", W / 2, H / 2 - 6);

      var b = uiById("exitRun");
      if (b) withPress(b, function (a) {
        var lit = Math.max(a.h, a.p);
        roundRect(b.x, b.y, b.w, b.h, 10);
        ctx.fillStyle = "rgba(255," + Math.round(255 - 164 * lit) + "," + Math.round(255 - 164 * lit) +
          "," + (0.07 + 0.15 * lit).toFixed(3) + ")";
        ctx.fill();
        roundRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1, 10);
        ctx.strokeStyle = "rgba(255," + Math.round(91 + 29 * lit) + "," + Math.round(91 + 29 * lit) + "," + (0.34 + 0.51 * lit).toFixed(3) + ")";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.font = "600 15px " + C.mono;
        ctx.fillStyle = lit > 0.5 ? "#ffb9b9" : "rgba(255,150,150,0.92)";
        ctx.fillText("退出本局", b.x + b.w / 2, b.y + 22);
        ctx.font = "500 10px " + C.mono;
        ctx.letterSpacing = "0.20em";
        ctx.fillStyle = "rgba(255," + Math.round(140 + 30 * lit) + "," + Math.round(140 + 30 * lit) + "," + (0.55 + 0.35 * lit).toFixed(3) + ")";
        ctx.fillText("ABANDON RUN", b.x + b.w / 2, b.y + 38);
        ctx.letterSpacing = "0px";
      });
    } else if (game.state === "over") {
      ctx.fillStyle = "rgba(10,4,6,0.82)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff6b6b";
      ctx.font = "800 56px " + C.mono;
      ctx.fillText("阵　亡", W / 2, H / 2 - 70);

      ctx.fillStyle = "#eef8ff";
      ctx.font = "700 30px " + C.mono;
      ctx.fillText("得分 " + game.score, W / 2, H / 2 - 10);

      ctx.font = "500 14px " + C.mono;
      ctx.fillStyle = "rgba(170,200,225,0.85)";
      var line = game.mode === "classic"
        ? "坚持 " + game.wave + " 波 · 击杀 " + game.kills + " · 存活 " + game.timeAlive.toFixed(1) + " 秒"
        : "到达 " + game.level + " 关 · 击杀 " + game.kills + " · 存活 " + game.timeAlive.toFixed(1) + " 秒";
      ctx.fillText(line, W / 2, H / 2 + 22);

      ctx.font = "600 16px " + C.mono;
      ctx.fillStyle = "rgba(140,235,255,0.95)";
      ctx.globalAlpha = 0.55 + Math.sin(performance.now() / 320) * 0.45;
      ctx.fillText("点击或按 R 重新开始 · Esc 返回", W / 2, H / 2 + 68);
      ctx.globalAlpha = 1;
    }
  }

  function render(t) {
    var sx = 0, sy = 0;
    if (game.shake > 0.2) {
      sx = rand(-game.shake, game.shake) * 0.3;
      sy = rand(-game.shake, game.shake) * 0.3;
    }

    drawBackground(t);

    if (game.state !== "menu") {
      ctx.save();
      ctx.translate(-game.cam.x + sx, -game.cam.y + sy);

      drawWalls();
      drawThresholds();

      for (var i = 0; i < game.pickups.length; i++) {
        var pk = game.pickups[i];
        var bob = Math.sin(pk.phase) * 3;
        ctx.save();
        ctx.translate(pk.x, pk.y + bob);
        ctx.beginPath();
        ctx.arc(0, 0, pk.r + 6, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(93,242,160,0.14)";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, pk.r, 0, Math.PI * 2);
        ctx.fillStyle = C.gain;
        ctx.fill();
        ctx.fillStyle = "rgba(6,30,18,0.9)";
        ctx.fillRect(-1.8, -6, 3.6, 12);
        ctx.fillRect(-6, -1.8, 12, 3.6);
        ctx.restore();
      }

      for (var j = 0; j < game.particles.length; j++) {
        var pt = game.particles[j];
        ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
      }
      ctx.globalAlpha = 1;

      for (var k = 0; k < game.bullets.length; k++) {
        var b = game.bullets[k];
        var tl = Math.hypot(b.vx, b.vy) || 1;
        var ux = b.vx / tl, uy = b.vy / tl;
        ctx.beginPath();
        ctx.moveTo(b.x - ux * 20, b.y - uy * 20);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = "rgba(160,240,255,0.55)";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(b.x - ux * 12, b.y - uy * 12);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = "rgba(235,252,255,0.95)";
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }

      for (var m = 0; m < game.enemies.length; m++) drawEnemy(game.enemies[m]);

      if (game.player && game.state !== "over") drawPlayer(game.player);

      ctx.restore();
    }

    if (game.hitFlash > 0) {
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
      vg.addColorStop(0, "rgba(255,0,0,0)");
      vg.addColorStop(1, "rgba(255,0,0," + (game.hitFlash * 0.45) + ")");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    var vg2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.85);
    vg2.addColorStop(0, "rgba(0,0,0,0)");
    vg2.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vg2;
    ctx.fillRect(0, 0, W, H);

    if (game.state === "menu") {
      drawMenu(t);
    } else {
      drawHUD();
      drawOverlay();
      drawCrosshair(game.state === "paused" ? hoverAmt() : 0);   // 准星永远在最上层，暂停时也不被遮罩压暗
    }
  }

  // ---------- 输入 ----------
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
    keys[e.code] = true;

    if (e.code === "Escape") {
      if (game.state === "over") { backToMenu(); return; }
      if (game.state === "menu") {
        if (game.screen !== "home") { game.screen = "home"; game.hoverId = null; game.pageT = 0; menuLayout(); }
        return;
      }
      togglePause();
      return;
    }

    if (game.state === "menu") {
      if (e.code === "Enter" || e.code === "Space") {
        if (game.screen === "mode") startRun();
        else if (game.screen === "equip") { game.screen = "home"; game.pageT = 0; menuLayout(); }
        else { game.screen = "mode"; game.hoverId = null; game.pageT = 0; menuLayout(); }
      }
      return;
    }

    if (e.code === "KeyR" && game.state === "over") { startRun(); return; }
  });

  window.addEventListener("keyup", function (e) { keys[e.code] = false; });

  canvas.addEventListener("mousemove", function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    if (game.state === "menu" || game.state === "paused") {
      var it = hitUi(mouse.x, mouse.y);
      game.hoverId = it ? it.id : null;
    } else {
      game.hoverId = null;
    }
  });

  // 按下只高亮，抬起且仍在同一块上才提交——按下就有反馈，滑走可以反悔
  canvas.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.down = true;

    if (game.state === "menu" || game.state === "paused") {
      var it = hitUi(mouse.x, mouse.y);
      game.hoverId = it ? it.id : null;
      game.pressId = it ? it.id : null;
      return;
    }
    if (game.state === "over") startRun();
  });

  window.addEventListener("mouseup", function (e) {
    if (e.button !== 0) return;
    mouse.down = false;
    var id = game.pressId;
    game.pressId = null;
    if (!id || (game.state !== "menu" && game.state !== "paused")) return;
    var it = hitUi(mouse.x, mouse.y);
    if (it && it.id === id) act(it);
  });

  window.addEventListener("blur", function () {
    mouse.down = false;
    game.pressId = null;
    keys = Object.create(null);
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // ---------- 主循环 ----------
  resize();
  menuLayout();
  var last = performance.now();
  var clock = 0;

  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    clock += dt;

    if (game.state === "playing") update(dt);
    else if (game.state === "menu" || game.state === "paused") uiStep(dt);
    render(clock);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
